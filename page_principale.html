            };

            // Icône universelle : bascule entre le rendu émoji classique et le style vectoriel choisi
            const Icon = ({ name, size = 20, className = '', strokeOverride }) => {
                if (iconStyle === 'emoji') {
                    return <span className={className} style={{ fontSize: size * 0.85, lineHeight: 1, display: 'inline-flex' }}>{EMOJI_MAP[name] || '❔'}</span>;
                }
                return (
                    <svg
                        width={size} height={size} viewBox="0 0 24 24" fill="none"
                        stroke={strokeOverride || iconColor} strokeWidth="2"
                        strokeLinecap="round" strokeLinejoin="round"
                        className={className} style={{ flexShrink: 0 }}
                    >
                        {renderIconPath(name)}
                    </svg>
                );
            };

            const ICON_COLOR_PRESETS = ['#a8c7fa', '#a8fab0', '#c7a8fa', '#fab8a8', '#fad9a8', '#f5f5f5'];

            const readFileContent = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => resolve(`[Fichier : ${file.name}]`);
                    if (file.type.startsWith('text/') || /\.(txt|md|csv|json|js|html|css|py|xml|log|ts)$/i.test(file.name)) {
                        reader.readAsText(file);
                    } else {
                        resolve(`[Document joint : ${file.name} - taille: ${(file.size / 1024).toFixed(1)} Ko]`);
                    }
                });
            };

            const addSource = (sourceName, content = '') => {
                setSources(prev => [...prev, { 
                    name: sourceName, 
                    content: content || `Source : ${sourceName}`,
                    id: Date.now() + Math.random() 
                }]);
                setIsModalOpen(false);
            };

            const removeSource = (id) => {
                setSources(sources.filter(s => s.id !== id));
            };

            // Gestionnaire de fichiers glissés-déposés
            const handleDrop = async (e) => {
                e.preventDefault();
                e.stopPropagation();
                const droppedFiles = Array.from(e.dataTransfer.files);
                if (droppedFiles.length > 0) {
                    const newSources = [];
                    for (const file of droppedFiles) {
                        const content = await readFileContent(file);
                        newSources.push({
                            name: file.name,
                            content: content,
                            id: Date.now() + Math.random()
                        });
                    }
                    setSources(prev => [...prev, ...newSources]);
                    if (notebookTitle === 'Notebook sans titre' && droppedFiles[0].name) {
                        setNotebookTitle(droppedFiles[0].name.split('.')[0] + ' (Notebook)');
                    }
                }
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                const newSources = [];
                for (const file of files) {
                    const content = await readFileContent(file);
                    newSources.push({
                        name: file.name,
                        content: content,
                        id: Date.now() + Math.random()
                    });
                }
                setSources(prev => [...prev, ...newSources]);
                if (notebookTitle === 'Notebook sans titre' && files[0]?.name) {
                    setNotebookTitle(files[0].name.split('.')[0] + ' (Notebook)');
                }
                setIsModalOpen(false);
                e.target.value = '';
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
            };

            // --- FONCTIONNALITÉ : Speech-to-Text (Reconnaissance vocale) ---
            const toggleSpeechRecognition = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Votre navigateur ne supporte pas la reconnaissance vocale. Veuillez utiliser Google Chrome.");
                    return;
                }

                if (isListening) {
                    setIsListening(false);
                    return;
                }

                const recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = () => {
                    setIsListening(true);
                };

                recognition.onresult = (event) => {
                    const speechResult = event.results[0][0].transcript;
                    setInputQuery(prev => (prev ? prev + " " + speechResult : speechResult));
                };

                recognition.onerror = (event) => {
                    console.error("Erreur de reconnaissance vocale", event.error);
                    setIsListening(false);
                };

                recognition.onend = () => {
                    setIsListening(false);
                };

                recognition.start();
            };

            // --- FONCTIONNALITÉ : Text-to-Speech (Synthèse vocale) ---
            const speakText = (text, index) => {
                if (!('speechSynthesis' in window)) {
                    alert("La synthèse vocale n'est pas supportée par votre navigateur.");
                    return;
                }

                if (isSpeaking && activeSpeechIndex === index) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                    setActiveSpeechIndex(null);
                    return;
                }

                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.onend = () => {
                    setIsSpeaking(false);
                    setActiveSpeechIndex(null);
                };
                utterance.onerror = () => {
                    setIsSpeaking(false);
                    setActiveSpeechIndex(null);
                };

                setIsSpeaking(true);
                setActiveSpeechIndex(index);
                window.speechSynthesis.speak(utterance);
            };

            // --- FONCTIONNALITÉ : Scan Papier / Extraction de texte (OCR simulé) ---
            const handleScanPaper = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsScanning(true);
                const fileName = file.name;

                setTimeout(() => {
                    const simulatedExtractedText = `[Extrait scanné du document "${fileName}"] : \nDocument scanné avec succès. Les concepts clés, schémas et notes manuscrites ont été numérisés et sont prêts à être analysés dans le chat et dans le Studio.`;
                    
                    setSources(prev => [...prev, { 
                        name: `Scan : ${fileName}`, 
                        content: simulatedExtractedText,
                        id: Date.now() + Math.random() 
                    }]);
                    setChatHistory(prev => [
                        ...prev,
                        { type: 'human', text: `📸 Scan de document papier : ${fileName}` },
                        { type: 'ai', text: simulatedExtractedText }
                    ]);
                    setIsScanning(false);
                    if (notebookTitle === 'Notebook sans titre') {
                        setNotebookTitle(`Scan - ${fileName.split('.')[0]}`);
                    }
                }, 1500);
            };

            const handleChatSubmit = async (e) => {
                e.preventDefault();
                if (!inputQuery.trim() || isGenerating) return;

                const userQuestion = inputQuery.trim();
                const newQuestion = { type: 'human', text: userQuestion };
                const newHistory = [...chatHistory, newQuestion];
                setChatHistory(newHistory);
                setInputQuery('');
                setIsGenerating(true);

                try {
                    const sourcesContext = compileSourcesContext();
                    const systemPrompt = `Tu es l'assistant IA intelligent de Notebook IA.
${sourcesContext ? `Voici les sources documentaires de l'utilisateur sur lesquelles tu dois te baser pour répondre avec rigueur et précision :\n\n${sourcesContext}\n\nSi la réponse ne figure pas dans les sources, indique-le clairement tout en apportant une réponse avec tes connaissances générales.` : "L'utilisateur n'a pas encore ajouté de sources détaillées dans ce notebook. Réponds à sa question de façon claire, complète et chaleureuse, en lui suggérant d'ajouter des documents à gauche pour une analyse personnalisée."}
Réponds toujours en français, avec clarté, pertinence et une mise en page soignée.`;

                    // Transmettre les derniers échanges pour le contexte conversationnel
                    const recentDialog = chatHistory.slice(-4).map(m => `${m.type === 'human' ? 'Utilisateur' : 'Assistant'}: ${m.text}`).join('\n');
                    const fullPrompt = `${recentDialog ? `Contexte des échanges précédents :\n${recentDialog}\n\n` : ''}Question de l'utilisateur : ${userQuestion}`;

                    const aiResponse = await callAI(fullPrompt, systemPrompt);
                    setChatHistory([...newHistory, { type: 'ai', text: aiResponse }]);
                } catch (err) {
                    setChatHistory([...newHistory, { 
                        type: 'ai', 
                        text: `⚠️ Erreur lors de la génération : ${err.message || 'Impossible de joindre le service IA'}.\nVérifiez vos clés API ou ajoutez-en de nouvelles via le bouton « Clés API » en haut.` 
                    }]);
                } finally {
                    setIsGenerating(false);
                }
            };

            const studioTools = [
                { id: 'iconstyle', icon: 'sparkles', title: 'Style des icônes', badge: 'Outil', hoverLabel: 'Personnaliser', onClick: () => setIsIconModalOpen(true) },
                { id: 'audio', icon: 'headphones', title: 'Résumé audio', desc: 'Génère un résumé audio des sources sélectionnées.' },
                { id: 'video', icon: 'monitor', title: 'Résumé vidéo', desc: 'Génère une vidéo explicative à partir des sources.' },
                { id: 'mind', icon: 'brain', title: 'Carte mentale', desc: 'Construit une carte mentale des concepts clés.' },
                { id: 'report', icon: 'barChart2', title: 'Rapports', badge: 'Nouveau !', desc: 'Produit un rapport structuré sur vos sources.' },
                { id: 'flash', icon: 'bookOpen', title: "Fiches d'étude", desc: "Crée des fiches de révision question/réponse." },
                { id: 'quiz', icon: 'helpCircle', title: 'Quiz', desc: 'Génère un quiz basé sur le contenu des sources.' },
                { id: 'info', icon: 'trendingUp', title: 'Infographie', desc: 'Compose une infographie synthétique.' },
                { id: 'data', icon: 'table', title: 'Tableau de données', desc: 'Extrait les données sous forme de tableau.' },
            ];

            return (
                <div className="flex flex-col h-screen">
                    
                    {/* Input caché global pour le scan papier */}
                    <input 
                        type="file" 
                        ref={fileInputRef} 
                        onChange={handleScanPaper} 
                        accept="image/*,.pdf" 
                        className="hidden" 
                    />

                    {/* Input caché pour l'import de documents texte et sources */}
                    <input 
                        type="file" 
                        ref={docFileInputRef} 
                        onChange={handleFileUpload} 
                        multiple 
                        accept=".txt,.md,.pdf,.doc,.docx,.csv,.json,.html,.py,.js,.ts" 
                        className="hidden" 
                    />

                    {/* En-tête épuré */}
                    <header className="h-[60px] flex justify-between items-center px-5 border-b border-nb-border shrink-0 z-50 bg-nb-main">
                        <div className="flex items-center gap-3 text-lg font-medium tracking-tight">
                            <a
                                href="Dashboard.html"
                                title="Retour au Dashboard"
                                className="w-8 h-8 flex items-center justify-center rounded-full bg-transparent border border-nb-border text-nb-text-main hover:bg-nb-hover transition cursor-pointer shrink-0"
                            >
                                <Icon name="arrowLeft" size={16} />
                            </a>
                            <HumanRobotIcon />
                            <span className="truncate max-w-[220px]" title={notebookTitle}>{notebookTitle}</span>
                            
                            {/* Affichage de l'heure en haut */}
                            <div className="hidden md:flex items-center gap-1.5 bg-nb-card border border-nb-border px-3 py-1 rounded-full text-xs font-mono text-nb-accent">
                                <span>{placeLabel && `${placeLabel} · `}{currentTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>
                            </div>
                        </div>

                        <div className="flex items-center gap-2.5">
                            {/* Bouton de gestion des Clés API */}
                            <button
                                onClick={() => setIsApiModalOpen(true)}
                                className="flex items-center gap-1.5 bg-nb-card border border-nb-accent/40 text-nb-accent px-3 py-1.5 rounded-full text-sm hover:bg-nb-hover transition cursor-pointer"
                                title="Gérer et ajouter vos clés API (Gemini & Groq)"
                            >
                                <span className="w-2 h-2 rounded-full bg-green-400"></span>
                                <Icon name="key" size={15} strokeOverride="#a8c7fa" />
                                <span className="hidden sm:inline font-medium">Clés API</span>
                            </button>

                            <button
                                onClick={() => setIsFocusOpen(prev => !prev)}
                                className={`flex items-center gap-1.5 border px-4 py-1.5 rounded-full text-sm transition cursor-pointer ${isFocusOpen ? 'bg-nb-accent text-nb-main border-nb-accent' : 'bg-transparent border-nb-border text-nb-text-main hover:bg-nb-hover'}`}
                            >
                                <Icon name="headphones" size={15} strokeOverride={isFocusOpen ? '#131314' : undefined} /> <span className="hidden sm:inline">Focus</span>
                            </button>
                            <button 
                                onClick={handleNewNotebook}
                                className="bg-transparent border border-nb-border text-nb-text-main px-4 py-1.5 rounded-full text-sm hover:bg-nb-hover transition cursor-pointer flex items-center gap-1.5"
                            >
                                <Icon name="plus" size={15} /> <span className="hidden sm:inline">Nouveau Notebook</span>
                            </button>
                            <button onClick={handleShare} className="flex items-center gap-1.5 bg-transparent border border-nb-border text-nb-text-main px-4 py-1.5 rounded-full text-sm hover:bg-nb-hover transition cursor-pointer">
                                <Icon name="share" size={15} /> <span className="hidden sm:inline">Partager</span>
                            </button>
                            <div className="relative">
                                <button
                                    onClick={() => setIsUserMenuOpen(prev => !prev)}
                                    className="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-white font-medium text-sm ml-1 cursor-pointer ring-2 ring-nb-border ring-offset-2 ring-offset-nb-main"
                                    title={currentUsername}
                                >
                                    {currentUsername.charAt(0).toUpperCase()}
                                </button>

                                {isUserMenuOpen && (
                                    <>
                                        <div className="fixed inset-0 z-40" onClick={() => setIsUserMenuOpen(false)}></div>
                                        <div className="absolute right-0 top-11 w-56 bg-nb-panel border border-nb-border rounded-2xl shadow-2xl z-50 p-2 animate-fadeIn">
                                            <div className="px-3 py-2.5 border-b border-nb-border mb-1">
                                                <p className="text-sm font-medium text-nb-text-main truncate">{currentUsername}</p>
                                                <p className="text-xs text-nb-text-muted truncate">{currentUsername.toLowerCase().replace(/\s+/g, '.')}@notebook.ia</p>
                                            </div>
                                            <button
                                                onClick={() => { setIsUserMenuOpen(false); setIsLogoutModalOpen(true); }}
                                                className="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm text-red-400 hover:bg-nb-hover transition cursor-pointer text-left"
                                            >
                                                <Icon name="logout" size={16} strokeOverride="#f87171" />
                                                Déconnexion
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Bannière : consultation d'un notebook partagé en lecture seule */}
                    {isViewingSharedNotebook && (
                        <div className="bg-nb-accent/10 border-b border-nb-accent/30 px-5 py-2 flex items-center justify-between gap-3 text-xs shrink-0">
                            <div className="flex items-center gap-2 text-nb-accent">
                                <Icon name="link" size={14} strokeOverride="#a8c7fa" />
                                <span>Vous consultez une version <strong>partagée en lecture seule</strong> de ce notebook.</span>
                            </div>
                            <button
                                onClick={handleDuplicateSharedNotebook}
                                className="bg-nb-accent text-nb-main px-3 py-1 rounded-full font-medium hover:opacity-90 transition cursor-pointer shrink-0"
                            >
                                Continuer en édition
                            </button>
                        </div>
                    )}
                    {isLoadingSharedNotebook && (
                        <div className="bg-nb-card border-b border-nb-border px-5 py-2 flex items-center gap-2 text-xs text-nb-text-muted shrink-0">
                            <div className="w-3.5 h-3.5 border-2 border-nb-border border-t-nb-accent rounded-full animate-spin"></div>
                            Chargement du notebook partagé…
                        </div>
                    )}
                    {sharedLoadError && (
                        <div className="bg-red-950/40 border-b border-red-800/50 px-5 py-2 text-xs text-red-300 shrink-0">
                            ⚠️ {sharedLoadError}
                        </div>
                    )}

                    {/* Corps Principal */}
                    <div className="flex flex-1 h-[calc(100vh-60px)] overflow-hidden">
                        
                        {/* Panneau de Gauche : Sources avec Drag & Drop */}
                        <aside className="w-[300px] bg-nb-panel border-r border-nb-border flex flex-col p-4 shrink-0 z-10">
                            <h3 className="text-[0.95rem] font-semibold mb-3 px-1">Sources</h3>
                            <button 
                                onClick={() => setIsModalOpen(true)}
                                className="bg-nb-text-main text-nb-main border-none py-2.5 px-4 rounded-full font-semibold text-center text-sm mb-4 hover:opacity-90 transition cursor-pointer flex items-center justify-center gap-2"
                            >
                                <Icon name="plus" size={15} /> Ajouter des sources
                            </button>
                            
                            {/* Zone interactive de glisser-déposer */}
                            <div 
                                className="flex-1 overflow-y-auto pr-1 space-y-2 flex flex-col"
                                onDragOver={handleDragOver}
                                onDrop={handleDrop}
                            >
                                {sources.length === 0 ? (
                                    <div 
                                        className="border-2 border-dashed border-nb-border hover:border-nb-accent rounded-xl flex flex-col items-center justify-center text-center p-6 text-nb-text-muted text-sm h-full transition cursor-pointer"
                                        onClick={() => setIsModalOpen(true)}
                                    >
                                        <Icon name="folder" size={32} className="mb-2 mx-auto" strokeOverride="#8e918f" />
                                        <p><strong>Glissez-déposez vos fichiers ici</strong><br />
                                        ou cliquez pour en ajouter.<br />
                                        <span className="text-xs text-nb-text-muted mt-2 block">(PDF, Docs, Images, Scan...)</span></p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="space-y-2">
                                            {sources.map((source) => (
                                                <div key={source.id} className="bg-nb-card border border-nb-border rounded-lg p-3 flex items-center justify-between group hover:bg-nb-hover transition cursor-pointer">
                                                    <div className="flex items-center gap-3 truncate">
                                                        <Icon name="fileText" size={16} strokeOverride="#8e918f" />
                                                        <span className="text-sm truncate" title={source.name}>{source.name}</span>
                                                    </div>
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            removeSource(source.id);
                                                        }}
                                                        className="text-nb-text-muted opacity-0 group-hover:opacity-100 transition hover:text-red-400 text-lg px-1"
                                                    >
                                                        ×
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="border border-dashed border-nb-border/60 rounded-xl p-4 text-center text-nb-text-muted text-xs mt-2 hover:border-nb-accent transition">
                                            Glissez d'autres fichiers ici
                                        </div>
                                    </>
                                )}
                            </div>
                        </aside>

                        {/* Panneau Central : Espace d'échange */}
                        <main className="flex-1 flex flex-col p-8 bg-nb-main overflow-y-auto relative">
                            
                            <div className="flex-1 max-w-[850px] w-full mx-auto space-y-6 pb-28 flex flex-col justify-end">
                                {chatHistory.map((msg, index) => (
                                    <div key={index} className={`flex items-start gap-4 ${msg.type === 'human' ? 'justify-end' : ''}`}>
                                        {msg.type === 'ai' && (
                                            <div className="w-9 h-9 rounded-full bg-nb-accent flex items-center justify-center text-nb-main shrink-0 mt-1">
                                                <Icon name="bot" size={18} strokeOverride="#131314" />
                                            </div>
                                        )}
                                        <div className={`p-5 rounded-2xl max-w-[70%] text-[15px] leading-relaxed shadow-lg relative group ${msg.type === 'human' ? 'bg-nb-accent text-nb-main rounded-br-none' : 'bg-nb-panel text-nb-text-main rounded-bl-none'}`}>
                                            {msg.text}

                                            {/* Bouton Synthèse Vocale (Text-to-Speech) pour les messages de l'IA */}
                                            {msg.type === 'ai' && (
                                                <button 
                                                    onClick={() => speakText(msg.text, index)}
                                                    className={`absolute -bottom-3 right-4 bg-nb-card border border-nb-border hover:bg-nb-hover text-nb-text-main text-xs px-2.5 py-1 rounded-full shadow transition flex items-center gap-1 cursor-pointer ${isSpeaking && activeSpeechIndex === index ? 'text-nb-accent border-nb-accent animate-pulse' : ''}`}
                                                    title="Écouter la réponse"
                                                >
                                                    <Icon name={isSpeaking && activeSpeechIndex === index ? 'stop' : 'volume2'} size={13} />
                                                    <span>{isSpeaking && activeSpeechIndex === index ? 'Arrêter' : 'Écouter'}</span>
                                                </button>
                                            )}
                                        </div>
                                        {msg.type === 'human' && (
                                            <div className="w-9 h-9 rounded-full bg-purple-600 flex items-center justify-center text-white font-medium text-sm shrink-0 mt-1">{currentUsername.charAt(0).toUpperCase()}</div>
                                        )}
                                    </div>
                                ))}
                                {isGenerating && (
                                    <div className="flex items-start gap-4">
                                        <div className="w-9 h-9 rounded-full bg-nb-accent flex items-center justify-center text-nb-main shrink-0 mt-1"><Icon name="bot" size={18} strokeOverride="#131314" /></div>
                                        <div className="p-5 rounded-2xl bg-nb-panel text-nb-text-muted rounded-bl-none flex items-center gap-1.5">
                                            <div className="w-2 h-2 bg-nb-text-muted rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                                            <div className="w-2 h-2 bg-nb-text-muted rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                                            <div className="w-2 h-2 bg-nb-text-muted rounded-full animate-bounce"></div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Barre de saisie fixe en bas avec Speech-to-Text */}
                            <div className="fixed bottom-0 left-[300px] right-[340px] bg-gradient-to-t from-nb-main via-nb-main to-transparent pt-6 pb-6 px-8">
                                <div className="max-w-[850px] w-full mx-auto">
                                    <form onSubmit={handleChatSubmit} className="bg-nb-panel border border-nb-border rounded-[30px] px-5 py-3.5 flex items-center gap-3 shadow-2xl">
                                        
                                        {/* Bouton Dictée vocale (Speech-to-Text) */}
                                        <button 
                                            type="button"
                                            onClick={toggleSpeechRecognition}
                                            className={`w-9 h-9 rounded-full flex items-center justify-center transition cursor-pointer shrink-0 ${isListening ? 'bg-red-500 text-white animate-pulse' : 'bg-nb-card border border-nb-border text-nb-text-muted hover:text-white hover:bg-nb-hover'}`}
                                            title={isListening ? "Arrêter l'écoute..." : "Dicter votre question vocalement"}
                                        >
                                            <Icon name="mic" size={16} strokeOverride={isListening ? '#ffffff' : undefined} />
                                        </button>

                                        <input 
                                            type="text" 
                                            placeholder={isListening ? "Écoute en cours... Parlez maintenant..." : "Posez une question, demandez un résumé ou créez quelque chose..."} 
                                            value={inputQuery}
                                            onChange={(e) => setInputQuery(e.target.value)}
                                            className="flex-1 bg-transparent border-none text-nb-text-main text-[15px] outline-none placeholder:text-nb-text-muted"
                                        />
                                        
                                        <span className="text-xs text-nb-text-muted font-medium bg-nb-card px-2.5 py-1 rounded-full hidden sm:inline">
                                            {sources.length} {sources.length === 1 ? 'source' : 'sources'} active{sources.length !== 1 ? 's' : ''}
                                        </span>

                                        <button 
                                            type="submit" 
                                            disabled={isGenerating}
                                            className={`bg-nb-accent border-none w-10 h-10 rounded-full flex items-center justify-center text-nb-main font-bold cursor-pointer transition ${isGenerating ? 'opacity-50 cursor-not-allowed' : 'hover:opacity-95'}`}
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.5" stroke="currentColor" className="w-5 h-5">
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
                                            </svg>
                                        </button>
                                    </form>
                                    <div className="text-center text-xs text-nb-text-muted mt-3.5 font-light">
                                        Vérifiez les informations importantes. L'assistant peut parfois se tromper.
                                    </div>
                                </div>
                            </div>
                        </main>

                        {/* Panneau de Droite : Studio IA */}
                        <aside className="w-[340px] bg-nb-panel border-l border-nb-border flex flex-col p-5 overflow-y-auto shrink-0 z-10">
                            <h3 className="text-[0.95rem] font-semibold mb-1 px-1">Studio</h3>
                            <p className="text-sm text-nb-text-muted mb-5 px-1 leading-normal">Transformez vos sources en outils d'apprentissage interactifs.</p>
                            
                            <div className="grid grid-cols-2 gap-3">
                                {studioTools.map((tool) => (
                                    <button 
                                        key={tool.id} 
                                        onClick={tool.onClick || (() => openStudioTool(tool))}
                                        className={`relative bg-nb-card border rounded-xl p-4 text-left cursor-pointer hover:bg-nb-hover transition flex flex-col gap-2.5 group ${tool.id === 'iconstyle' ? 'border-nb-accent/40' : 'border-nb-border'}`}
                                    >
                                        {studioResults[tool.id] && (
                                            <span className="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-green-500"></span>
                                        )}
                                        <Icon name={tool.icon} size={22} />
                                        <div className="text-sm font-medium flex flex-col gap-1.5 text-nb-text-main">
                                            {tool.title}
                                            {tool.badge && (
                                                <span className="text-[10px] font-semibold bg-blue-900/60 text-nb-accent px-2 py-0.5 rounded-full w-fit tracking-wider uppercase">
                                                    {tool.badge}
                                                </span>
                                            )}
                                        </div>
                                        <span className="text-xs text-nb-text-muted mt-1 opacity-0 group-hover:opacity-100 transition">{tool.hoverLabel || (studioResults[tool.id] ? 'Voir' : 'Générer')} →</span>
                                    </button>
                                ))}
                            </div>

                            <button className="mt-10 w-full bg-transparent border border-nb-border text-nb-text-main py-3 px-4 rounded-full text-center text-sm hover:bg-nb-hover transition cursor-pointer flex items-center justify-center gap-2.5 font-medium">
                                <Icon name="pin" size={15} /> Voir les notes enregistrées
                            </button>
                        </aside>

                    </div>

                    {/* Panneau flottant : Mode Focus (minuteur Pomodoro + sons d'ambiance) */}
                    {isFocusOpen && (
                        <div className="fixed bottom-24 right-6 w-[300px] bg-nb-panel border border-nb-border rounded-3xl p-5 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.6)] z-[90] animate-scaleIn">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-2 text-sm font-semibold">
                                    <Icon name="headphones" size={16} /> Mode Focus
                                </div>
                                <button onClick={() => setIsFocusOpen(false)} className="bg-transparent border-none text-nb-text-muted text-2xl cursor-pointer hover:text-white leading-none">×</button>
                            </div>

                            <div className="bg-nb-card border border-nb-border rounded-2xl p-4 mb-4 text-center">
                                <div className="flex justify-center gap-2 mb-3">
                                    {[['focus', 'Focus'], ['short', 'Pause'], ['long', 'Pause+']].map(([key, label]) => (
                                        <button key={key} onClick={() => switchPomoMode(key)}
                                            className={`px-2.5 py-1 rounded-full text-[11px] font-medium transition cursor-pointer ${pomoMode === key ? 'bg-nb-accent text-nb-main' : 'bg-nb-hover text-nb-text-muted hover:text-white'}`}>
                                            {label}
                                        </button>
                                    ))}
                                </div>
                                <div className="text-4xl font-mono font-semibold tracking-wider mb-3">{formatTime(timeLeft)}</div>
                                <div className="flex justify-center gap-2 mb-2">
                                    <button onClick={toggleTimer} className="w-10 h-10 rounded-full bg-nb-text-main text-nb-main flex items-center justify-center hover:opacity-90 transition cursor-pointer">
                                        <Icon name={isTimerRunning ? 'pause' : 'play'} size={16} strokeOverride="#131314" />
                                    </button>
                                    <button onClick={resetTimer} className="w-10 h-10 rounded-full border border-nb-border text-nb-text-main flex items-center justify-center hover:bg-nb-hover transition cursor-pointer">
                                        <Icon name="refresh" size={15} />
                                    </button>
                                </div>
                                <p className="text-[11px] text-nb-text-muted">{pomoCount} pomodoro{pomoCount !== 1 ? 's' : ''} terminé{pomoCount !== 1 ? 's' : ''}</p>
                            </div>

                            <h4 className="text-[11px] uppercase tracking-wider text-nb-text-muted mb-2 font-semibold px-1">Ambiance sonore</h4>
                            <div className="grid grid-cols-3 gap-2 mb-3">
                                {[['rain', 'cloudRain', 'Pluie'], ['cafe', 'coffee', 'Café'], ['lofi', 'music', 'Lofi']].map(([key, icon, label]) => (
                                    <button key={key} onClick={() => toggleAmbientSound(key)}
                                        className={`flex flex-col items-center gap-1.5 py-3 rounded-xl border text-[11px] transition cursor-pointer ${activeSound === key ? 'border-nb-accent bg-nb-accent/10 text-nb-accent' : 'border-nb-border bg-nb-card text-nb-text-muted hover:bg-nb-hover'}`}>
                                        <Icon name={icon} size={18} strokeOverride={activeSound === key ? '#a8c7fa' : undefined} />
                                        {label}
                                    </button>
                                ))}
                            </div>
                            <h4 className="text-[11px] uppercase tracking-wider text-nb-text-muted mb-2 font-semibold px-1">Lien personnalisé</h4>
                            <div className="flex items-center gap-2 mb-1">
                                <input
                                    type="text"
                                    placeholder="Coller un lien audio (.mp3, .wav...)"
                                    value={customUrl}
                                    onChange={(e) => setCustomUrl(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && toggleCustomSound()}
                                    className="flex-1 bg-nb-card border border-nb-border rounded-full px-3 py-1.5 text-xs text-nb-text-main outline-none placeholder:text-nb-text-muted"
                                />
                                <button onClick={toggleCustomSound}
                                    className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 transition cursor-pointer border ${activeSound === 'custom' ? 'bg-nb-accent border-nb-accent text-nb-main' : 'bg-nb-card border-nb-border text-nb-text-muted hover:bg-nb-hover'}`}
                                    title={activeSound === 'custom' ? 'Arrêter' : 'Lire'}
                                >
                                    <Icon name={activeSound === 'custom' ? 'pause' : 'play'} size={13} strokeOverride={activeSound === 'custom' ? '#131314' : undefined} />
                                </button>
                            </div>
                            <p className="text-[10px] text-nb-text-muted px-1 mb-3">Lien direct vers un fichier audio uniquement — pas de liens YouTube ou Spotify.</p>
                            <audio ref={customAudioRef} className="hidden" />

                            {activeSound && (
                                <div className="flex items-center gap-2 px-1">
                                    <Icon name="volume2" size={14} strokeOverride="#8e918f" />
                                    <input type="range" min="0" max="1" step="0.01" value={soundVolume}
                                        onChange={(e) => setSoundVolume(parseFloat(e.target.value))}
                                        className="flex-1 accent-nb-accent cursor-pointer" />
                                </div>
                            )}
                        </div>
                    )}

                    {/* Modale d'ajout de sources */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] p-4 animate-fadeIn backdrop-blur-sm">
                            <div className="bg-nb-panel border border-nb-border rounded-3xl w-[600px] p-8 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] animate-scaleIn">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-2xl font-normal tracking-tight">Ajouter à ce notebook</h2>
                                    <button 
                                        onClick={() => setIsModalOpen(false)}
                                        className="bg-transparent border-none text-nb-text-muted text-3xl cursor-pointer hover:text-white leading-none"
                                    >
                                        ×
                                    </button>
                                </div>
                                <div className="grid grid-cols-3 gap-4">
                                    {[
                                        { icon: 'upload', title: 'Importer des fichiers', desc: 'PDF, Docs, Images...' },
                                        { icon: 'camera', title: 'Scanner un papier', desc: 'OCR de documents' },
                                        { icon: 'link', title: 'Sites Web', desc: 'Coller une URL' },
                                        { icon: 'cloud', title: 'Google Drive', desc: 'Sélectionner depuis votre Drive' },
                                        { icon: 'clipboard', title: 'Texte copié', desc: 'Coller directement du texte' },
                                        { icon: 'edit3', title: 'Rédiger une note', desc: 'Créer une source vierge' }
                                    ].map((item, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => {
                                                if (item.title === 'Scanner un papier') {
                                                    setIsModalOpen(false);
                                                    fileInputRef.current.click();
                                                } else if (item.title === 'Importer des fichiers') {
                                                    setIsModalOpen(false);
                                                    docFileInputRef.current.click();
                                                } else if (item.title === 'Rédiger une note') {
                                                    const noteTitle = prompt("Titre de votre note :", "Note personnelle");
                                                    if (noteTitle) {
                                                        const noteContent = prompt("Contenu de votre note :");
                                                        addSource(noteTitle, noteContent || "(Note vide)");
                                                    }
                                                } else if (item.title === 'Texte copié') {
                                                    const pasted = prompt("Collez ici le texte ou l'article à analyser :");
                                                    if (pasted) {
                                                        addSource("Texte collé", pasted);
                                                    }
                                                } else if (item.title === 'Sites Web') {
                                                    const url = prompt("Collez l'adresse URL du site web :");
                                                    if (url) {
                                                        addSource(url, `Source Web : ${url}`);
                                                    }
                                                } else {
                                                    addSource(item.title, `Source : ${item.title}`);
                                                }
                                            }}
                                            className="bg-nb-card border border-nb-border rounded-2xl p-6 text-left cursor-pointer hover:bg-nb-hover transition flex flex-col gap-3 hover:border-nb-accent/30"
                                        >
                                            <Icon name={item.icon} size={30} className="mb-1" />
                                            <span className="font-medium text-nb-text-main text-[15px]">{item.title}</span>
                                            <span className="text-xs text-nb-text-muted">{item.desc}</span>
                                        </button>
                                    ))}
                                </div>
                                <div className="mt-8 text-center text-sm text-nb-text-muted bg-nb-card p-4 rounded-xl flex items-center justify-center gap-2">
                                    <Icon name="bulb" size={16} /> Conseil pro : Glissez et déposez vos fichiers ou utilisez l'option de scan pour extraire du texte instantanément.
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Espace de génération d'une carte Studio (audio, vidéo, quiz, etc.) */}
                    {activeStudioTool && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] p-4 animate-fadeIn backdrop-blur-sm">
                            <div className="bg-nb-panel border border-nb-border rounded-3xl w-[600px] max-w-full max-h-[85vh] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] animate-scaleIn flex flex-col overflow-hidden">

                                {/* En-tête fixe */}
                                <div className="flex justify-between items-center px-7 pt-7 pb-1 shrink-0">
                                    <div className="flex items-center gap-2.5 text-xl font-normal tracking-tight">
                                        <Icon name={activeStudioTool.icon} size={20} />
                                        <h2>{activeStudioTool.title}</h2>
                                    </div>
                                    <button
                                        onClick={() => setActiveStudioTool(null)}
                                        className="bg-transparent border-none text-nb-text-muted text-3xl cursor-pointer hover:text-white leading-none"
                                    >
                                        ×
                                    </button>
                                </div>
                                <p className="text-sm text-nb-text-muted px-7 mb-4 shrink-0">{activeStudioTool.desc}</p>

                                {/* Zone de résultat — défile indépendamment si le contenu est long */}
                                <div className="flex-1 overflow-y-auto px-7 min-h-0">
                                    <div className="bg-nb-card border border-dashed border-nb-border rounded-2xl min-h-[180px] p-5">
                                        {isGeneratingStudio ? (
                                            <div className="flex flex-col items-center justify-center gap-3 text-nb-text-muted text-sm h-full min-h-[150px]">
                                                <div className="w-6 h-6 border-2 border-nb-border border-t-nb-accent rounded-full animate-spin"></div>
                                                Génération en cours…
                                            </div>
                                        ) : studioResults[activeStudioTool.id] ? (
                                            <div className="w-full">{renderMarkdown(studioResults[activeStudioTool.id])}</div>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center gap-2 text-nb-text-muted text-sm text-center h-full min-h-[150px]">
                                                <Icon name={activeStudioTool.icon} size={26} strokeOverride="#5f6368" />
                                                Aucun contenu généré pour l'instant.
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Pied fixe */}
                                <div className="flex gap-3 px-7 py-5 shrink-0 border-t border-nb-border/50 mt-2">
                                    <button
                                        onClick={generateStudioContent}
                                        disabled={isGeneratingStudio}
                                        className="flex-1 bg-nb-text-main text-nb-main border-none py-2.5 rounded-full font-semibold text-sm hover:opacity-90 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {isGeneratingStudio ? 'Génération…' : studioResults[activeStudioTool.id] ? 'Régénérer' : 'Générer'}
                                    </button>
                                    {studioResults[activeStudioTool.id] && !isGeneratingStudio && (
                                        <button
                                            onClick={copyStudioResult}
                                            className="bg-transparent border border-nb-border text-nb-text-main px-5 py-2.5 rounded-full text-sm hover:bg-nb-hover transition cursor-pointer"
                                        >
                                            {isStudioResultCopied ? 'Copié !' : 'Copier'}
                                        </button>
                                    )}
                                    <button
                                        onClick={() => setActiveStudioTool(null)}
                                        className="bg-transparent border border-nb-border text-nb-text-main px-5 py-2.5 rounded-full text-sm hover:bg-nb-hover transition cursor-pointer"
                                    >
                                        Fermer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modale de l'outil : Style des icônes */}
                    {isIconModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] p-4 animate-fadeIn backdrop-blur-sm">
                            <div className="bg-nb-panel border border-nb-border rounded-3xl w-[480px] p-8 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] animate-scaleIn">
                                <div className="flex justify-between items-center mb-1">
                                    <div className="flex items-center gap-2 text-2xl font-normal tracking-tight">
                                        <Icon name="sparkles" size={22} />
                                        <h2>Style des icônes</h2>
                                    </div>
                                    <button 
                                        onClick={() => setIsIconModalOpen(false)}
                                        className="bg-transparent border-none text-nb-text-muted text-3xl cursor-pointer hover:text-white leading-none"
                                    >
                                        ×
                                    </button>
                                </div>
                                <p className="text-sm text-nb-text-muted mb-6">Personnalisez le rendu et la couleur des icônes dans toute l'interface.</p>

                                <h4 className="text-xs uppercase tracking-wider text-nb-text-muted mb-2 font-semibold">Rendu</h4>
                                <div className="grid grid-cols-2 gap-3 mb-6">
                                    <button
                                        onClick={() => setIconStyle('vector')}
                                        className={`rounded-xl p-3.5 border text-left transition flex items-center gap-2.5 ${iconStyle === 'vector' ? 'border-nb-accent bg-nb-accent/10' : 'border-nb-border bg-nb-card hover:bg-nb-hover'}`}
                                    >
                                        <Icon name="fileText" size={18} />
                                        <span className="text-sm font-medium">Vectoriel net</span>
                                        {iconStyle === 'vector' && <Icon name="check" size={14} className="ml-auto" strokeOverride="#a8c7fa" />}
                                    </button>
                                    <button
                                        onClick={() => setIconStyle('emoji')}
                                        className={`rounded-xl p-3.5 border text-left transition flex items-center gap-2.5 ${iconStyle === 'emoji' ? 'border-nb-accent bg-nb-accent/10' : 'border-nb-border bg-nb-card hover:bg-nb-hover'}`}
                                    >
                                        <span className="text-lg leading-none">📄</span>
                                        <span className="text-sm font-medium">Emoji classique</span>
                                        {iconStyle === 'emoji' && <Icon name="check" size={14} className="ml-auto" strokeOverride="#a8c7fa" />}
                                    </button>
                                </div>

                                <h4 className="text-xs uppercase tracking-wider text-nb-text-muted mb-2 font-semibold">Couleur des icônes</h4>
                                <div className={`flex items-center gap-3 mb-6 ${iconStyle === 'emoji' ? 'opacity-40 pointer-events-none' : ''}`}>
                                    {ICON_COLOR_PRESETS.map((hex) => (
                                        <button
                                            key={hex}
                                            onClick={() => setIconColor(hex)}
                                            title={hex}
                                            className={`w-8 h-8 rounded-full border-2 transition ${iconColor === hex ? 'border-white scale-110' : 'border-transparent hover:scale-105'}`}
                                            style={{ backgroundColor: hex }}
                                        />
                                    ))}
                                </div>

                                <h4 className="text-xs uppercase tracking-wider text-nb-text-muted mb-2 font-semibold">Aperçu</h4>
                                <div className="bg-nb-card border border-nb-border rounded-xl p-4 flex items-center gap-4 mb-2">
                                    <Icon name="bot" size={22} />
                                    <Icon name="mic" size={22} />
                                    <Icon name="fileText" size={22} />
                                    <Icon name="brain" size={22} />
                                    <Icon name="pin" size={22} />
                                    <Icon name="sparkles" size={22} />
                                </div>

                                <button
                                    onClick={() => setIsIconModalOpen(false)}
                                    className="mt-6 w-full bg-nb-text-main text-nb-main border-none py-2.5 px-4 rounded-full font-semibold text-center text-sm hover:opacity-90 transition cursor-pointer"
                                >
                                    Terminé
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Popup de confirmation : Déconnexion */}
                    {isLogoutModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] p-4 animate-fadeIn backdrop-blur-sm">
                            <div className="bg-nb-panel border border-nb-border rounded-3xl w-[380px] p-7 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] animate-scaleIn text-center">
                                <div className="w-14 h-14 rounded-full bg-red-500/10 flex items-center justify-center mx-auto mb-4">
                                    <Icon name="logout" size={24} strokeOverride="#f87171" />
                                </div>
                                <h2 className="text-lg font-medium mb-1.5">Se déconnecter ?</h2>
                                <p className="text-sm text-nb-text-muted mb-6">Vous devrez vous reconnecter pour retrouver vos notebooks et vos sources.</p>
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setIsLogoutModalOpen(false)}
                                        className="flex-1 bg-nb-card border border-nb-border text-nb-text-main py-2.5 rounded-full text-sm font-medium hover:bg-nb-hover transition cursor-pointer"
                                    >
                                        Annuler
                                    </button>
                                    <button
                                        onClick={() => { setIsLogoutModalOpen(false); setIsLoggedOut(true); }}
                                        className="flex-1 bg-red-500 border border-red-500 text-white py-2.5 rounded-full text-sm font-medium hover:bg-red-600 transition cursor-pointer"
                                    >
                                        Déconnexion
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Écran affiché après déconnexion */}
                    {isLoggedOut && (
                        <div className="fixed inset-0 bg-nb-main flex items-center justify-center z-[200] p-4">
                            <div className="text-center max-w-sm">
                                <HumanRobotIcon size={64} className="mx-auto mb-4 block" />
                                <h2 className="text-xl font-medium mt-4 mb-2">Vous êtes déconnecté</h2>
                                <p className="text-sm text-nb-text-muted mb-6">À bientôt ! Reconnectez-vous pour continuer sur vos notebooks.</p>
                                <button
                                    onClick={() => setIsLoggedOut(false)}
                                    className="bg-nb-text-main text-nb-main border-none py-2.5 px-6 rounded-full font-semibold text-sm hover:opacity-90 transition cursor-pointer"
                                >
                                    Se reconnecter
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modale de partage : génère un lien pour le notebook */}
                    {isShareModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] p-4 animate-fadeIn backdrop-blur-sm">
                            <div className="bg-nb-panel border border-nb-border rounded-3xl w-[460px] p-7 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] animate-scaleIn">
                                <div className="flex justify-between items-center mb-1">
                                    <div className="flex items-center gap-2 text-xl font-normal tracking-tight">
                                        <Icon name="share" size={19} />
                                        <h2>Partager « {notebookTitle} »</h2>
                                    </div>
                                    <button
                                        onClick={() => setIsShareModalOpen(false)}
                                        className="bg-transparent border-none text-nb-text-muted text-3xl cursor-pointer hover:text-white leading-none"
                                    >
                                        ×
                                    </button>
                                </div>
                                <p className="text-sm text-nb-text-muted mb-5">Toute personne disposant de ce lien pourra consulter ce notebook.</p>

                                {isSharing ? (
                                    <div className="flex items-center gap-3 text-sm text-nb-text-muted bg-nb-card border border-nb-border rounded-2xl px-4 py-3.5">
                                        <div className="w-4 h-4 border-2 border-nb-border border-t-nb-accent rounded-full animate-spin shrink-0"></div>
                                        Enregistrement sur Supabase…
                                    </div>
                                ) : shareError ? (
                                    <div className="text-xs text-red-300 bg-red-950/40 border border-red-800/50 rounded-2xl px-4 py-3.5 leading-relaxed">
                                        ⚠️ {shareError}
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-2 bg-nb-card border border-nb-border rounded-full px-2 py-1.5">
                                        <Icon name="link" size={16} className="ml-2 shrink-0" strokeOverride="#8e918f" />
                                        <input
                                            type="text"
                                            readOnly
                                            value={shareUrl}
                                            onFocus={(e) => e.target.select()}
                                            className="flex-1 bg-transparent border-none outline-none text-sm text-nb-text-main truncate"
                                        />
                                        <button
                                            onClick={copyShareLink}
                                            className={`shrink-0 flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer ${isLinkCopied ? 'bg-green-600 text-white' : 'bg-nb-text-main text-nb-main hover:opacity-90'}`}
                                        >
                                            <Icon name={isLinkCopied ? 'check' : 'clipboard'} size={14} strokeOverride={isLinkCopied ? '#ffffff' : undefined} />
                                            {isLinkCopied ? 'Copié !' : 'Copier'}
                                        </button>
                                    </div>
                                )}

                                <button
                                    onClick={() => setIsShareModalOpen(false)}
                                    className="mt-6 w-full bg-transparent border border-nb-border text-nb-text-main py-2.5 px-4 rounded-full font-medium text-center text-sm hover:bg-nb-hover transition cursor-pointer"
                                >
                                    Fermer
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modale de gestion des Clés API */}
                    {isApiModalOpen && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center z-[110] p-4 animate-fadeIn backdrop-blur-sm">
                            <div className="bg-nb-panel border border-nb-border rounded-3xl w-[620px] max-w-full p-7 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.6)] animate-scaleIn">
                                <div className="flex justify-between items-center mb-1">
                                    <div className="flex items-center gap-2.5 text-xl font-normal tracking-tight">
                                        <Icon name="key" size={22} strokeOverride="#a8c7fa" />
                                        <h2>Configuration des Clés API</h2>
                                    </div>
                                    <button 
                                        onClick={() => setIsApiModalOpen(false)}
                                        className="bg-transparent border-none text-nb-text-muted text-3xl cursor-pointer hover:text-white leading-none"
                                    >
                                        ×
                                    </button>
                                </div>
                                <p className="text-xs text-nb-text-muted mb-5">
                                    Vos requêtes de Chat et Studio utilisent directement ces clés. Le système applique une <strong>rotation automatique</strong> pour contourner les limites de quota (erreur 429).
                                </p>

                                {/* Statut actuel & Bouton Test */}
                                <div className="bg-nb-card border border-nb-border/70 rounded-2xl p-3.5 mb-4 flex items-center justify-between text-xs">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-green-400"></span>
                                        <span className="text-nb-text-muted">Statut :</span>
                                        <span className="text-nb-text-main font-mono">{apiStatusMessage}</span>
                                    </div>
                                    <button 
                                        type="button"
                                        onClick={testApiConnection}
                                        disabled={isTestingApi}
                                        className="bg-nb-hover border border-nb-border text-nb-text-main px-3 py-1 rounded-full text-xs hover:border-nb-accent transition cursor-pointer disabled:opacity-50"
                                    >
                                        {isTestingApi ? "Test en cours…" : "Tester la connexion"}
                                    </button>
                                </div>

                                {apiTestResult && (
                                    <div className={`p-3 rounded-xl mb-4 text-xs font-mono leading-relaxed ${apiTestResult.success ? 'bg-green-950/60 text-green-300 border border-green-800' : 'bg-red-950/60 text-red-300 border border-red-800'}`}>
                                        {apiTestResult.success ? '✅ ' : '❌ '}{apiTestResult.text}
                                    </div>
                                )}

                                {/* Mode d'utilisation */}
                                <div className="mb-4">
                                    <label className="text-xs font-semibold uppercase tracking-wider text-nb-text-muted block mb-2">Mode de fonctionnement</label>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                        {[
                                            { id: 'auto', label: 'Auto (Tous)' },
                                            { id: 'gemini', label: 'Gemini seul' },
                                            { id: 'openai', label: 'OpenAI seul' },
                                            { id: 'groq', label: 'Groq seul' }
                                        ].map(m => (
                                            <button
                                                key={m.id}
                                                type="button"
                                                onClick={() => setSelectedProvider(m.id)}
                                                className={`py-2 px-2.5 rounded-xl border text-xs text-center transition cursor-pointer ${selectedProvider === m.id ? 'border-nb-accent bg-nb-accent/15 text-nb-accent font-medium' : 'border-nb-border bg-nb-card text-nb-text-muted hover:bg-nb-hover'}`}
                                            >
                                                {m.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Zone Proxy sécurisé — les vraies clés API vivent sur le serveur (Worker), jamais ici */}
                                <div className="mb-5">
                                    <div className="flex justify-between items-center mb-1.5">
                                        <label className="text-xs font-semibold text-nb-text-main flex items-center gap-1.5">
                                            <span>Proxy API sécurisé</span>
                                            <span className={`w-2 h-2 rounded-full ${isProxyConfigured ? 'bg-green-400' : 'bg-red-500'}`}></span>
                                        </label>
                                        <span className="text-[11px] text-nb-text-muted font-mono">Gemini + OpenAI + Groq</span>
                                    </div>
                                    <input
                                        type="text"
                                        value={proxyUrlInput}
                                        onChange={(e) => setProxyUrlInput(e.target.value)}
                                        placeholder="URL du proxy — ex: https://notebook-ia-proxy.votre-compte.workers.dev"
                                        className="w-full bg-nb-card border border-nb-border rounded-xl p-2.5 text-xs font-mono text-nb-text-main outline-none focus:border-nb-accent placeholder:text-nb-text-muted mb-2"
                                    />
                                    <input
                                        type="password"
                                        value={proxyTokenInput}
                                        onChange={(e) => setProxyTokenInput(e.target.value)}
                                        placeholder="Proxy Token (optionnel, protège votre proxy contre les abus)"
                                        className="w-full bg-nb-card border border-nb-border rounded-xl p-2.5 text-xs font-mono text-nb-text-main outline-none focus:border-nb-accent placeholder:text-nb-text-muted"
                                    />
                                    <p className="text-[11px] text-nb-text-muted mt-2 leading-relaxed">
                                        Les clés API réelles ne sont jamais stockées ici ni dans ce fichier : elles vivent uniquement côté serveur, dans le Worker proxy. Voir <code className="bg-nb-card px-1 py-0.5 rounded">proxy/README.md</code> pour le déployer.
                                    </p>
                                </div>

                                {/* Zone Supabase (partage réel des notebooks) */}
                                <div className="mb-5 pt-4 border-t border-nb-border/60">
                                    <div className="flex justify-between items-center mb-1.5">
                                        <label className="text-xs font-semibold text-nb-text-main flex items-center gap-1.5">
                                            <span>Supabase — Partage de notebooks</span>
                                            <span className={`w-2 h-2 rounded-full ${isSupabaseConfigured ? 'bg-green-400' : 'bg-red-500'}`}></span>
                                        </label>
                                        <a
                                            href="https://supabase.com"
                                            target="_blank"
                                            rel="noreferrer"
                                            className="text-[11px] text-nb-accent hover:underline"
                                        >
                                            Créer un projet gratuit ↗
                                        </a>
                                    </div>
                                    <input
                                        type="text"
                                        value={supabaseUrlInput}
                                        onChange={(e) => setSupabaseUrlInput(e.target.value)}
                                        placeholder="Project URL — ex: https://abcdefghij.supabase.co"
                                        className="w-full bg-nb-card border border-nb-border rounded-xl p-2.5 text-xs font-mono text-nb-text-main outline-none focus:border-nb-accent placeholder:text-nb-text-muted mb-2"
                                    />
                                    <input
                                        type="text"
                                        value={supabaseKeyInput}
                                        onChange={(e) => setSupabaseKeyInput(e.target.value)}
                                        placeholder="Clé « anon public » (Project Settings → API)"
                                        className="w-full bg-nb-card border border-nb-border rounded-xl p-2.5 text-xs font-mono text-nb-text-main outline-none focus:border-nb-accent placeholder:text-nb-text-muted"
                                    />
                                    <p className="text-[11px] text-nb-text-muted mt-2 leading-relaxed">
                                        Nécessite une table <code className="bg-nb-card px-1 py-0.5 rounded">notebooks_partages</code> (colonnes <code className="bg-nb-card px-1 py-0.5 rounded">id text</code>, <code className="bg-nb-card px-1 py-0.5 rounded">title text</code>, <code className="bg-nb-card px-1 py-0.5 rounded">data jsonb</code>) avec des policies RLS publiques (lecture + insertion).
                                    </p>
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        type="button"
                                        onClick={saveApiKeysFromModal}
                                        className="flex-1 bg-nb-text-main text-nb-main border-none py-2.5 rounded-full font-semibold text-sm hover:opacity-90 transition cursor-pointer"
                                    >
                                        Enregistrer les clés
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setIsApiModalOpen(false)}
                                        className="bg-transparent border border-nb-border text-nb-text-main px-5 py-2.5 rounded-full text-sm hover:bg-nb-hover transition cursor-pointer"
                                    >
                                        Fermer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <style>{`
                        @keyframes fadeIn {
                            from { opacity: 0; }
                            to { opacity: 1; }
                        }
                        @keyframes scaleIn {
                            from { transform: scale(0.95); opacity: 0; }
                            to { transform: scale(1); opacity: 1; }
                        }
                        .animate-fadeIn {
                            animation: fadeIn 0.2s ease-out;
                        }
                        .animate-scaleIn {
                            animation: scaleIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                        }
                    `}</style>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NotebookApp />);
    </script>
</body>
</html>
