<head>
    <meta charset="UTF-8">

    <title>Notebook IA - Interface Professionnelle</title>
     <link rel="icon" type="image/x-icon" href="assets/app_logo.png">
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

<body class="bg-nb-main text-nb-text-main h-screen font-sans antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ================= RENDU MARKDOWN LÉGER (pour les résultats Studio générés par l'IA) =================
        function MarkdownInline({ text }) {
            const parts = [];
            const regex = /(\*\*[^*]+\*\*|\*[^*]+\*)/g;
            let lastIndex = 0;
            let match;
            let key = 0;
            while ((match = regex.exec(text)) !== null) {
                if (match.index > lastIndex) parts.push(text.slice(lastIndex, match.index));
                const token = match[0];
                if (token.startsWith('**')) {
                    parts.push(<strong key={key++} className="text-nb-text-main font-semibold">{token.slice(2, -2)}</strong>);
                } else {
                    parts.push(<em key={key++} className="italic">{token.slice(1, -1)}</em>);
                }
                lastIndex = regex.lastIndex;
            }
            if (lastIndex < text.length) parts.push(text.slice(lastIndex));
            return <React.Fragment>{parts}</React.Fragment>;
        }

        function renderMarkdown(content) {
            if (!content) return null;
            const lines = content.replace(/\r\n/g, '\n').split('\n');
            const blocks = [];
            let i = 0;
            let key = 0;

            const isHeading = (l) => /^(#{1,4})\s+/.test(l);
            const isHr = (l) => /^-{3,}$/.test(l.trim());
            const isTableRow = (l) => /^\|.*\|\s*$/.test(l);
            const isListItem = (l) => /^\s*([-•*]|\d+[.)])\s+/.test(l);

            while (i < lines.length) {
                const line = lines[i];

                if (line.trim() === '') { i++; continue; }

                if (isHr(line)) {
                    blocks.push(<hr key={key++} className="border-nb-border/60 my-4" />);
                    i++;
                    continue;
                }

                const headingMatch = line.match(/^(#{1,4})\s+(.*)$/);
                if (headingMatch) {
                    const level = headingMatch[1].length;
                    const sizes = {
                        1: 'text-lg font-semibold mt-1 mb-2',
                        2: 'text-base font-semibold mt-4 mb-2 pb-1 border-b border-nb-border/50',
                        3: 'text-sm font-semibold mt-3 mb-1.5 text-nb-accent',
                        4: 'text-sm font-medium mt-2 mb-1'
                    };
                    blocks.push(
                        <p key={key++} className={`${sizes[level] || sizes[4]} text-nb-text-main`}>
                            <MarkdownInline text={headingMatch[2]} />
                        </p>
                    );
                    i++;
                    continue;
                }

                if (isTableRow(line) && lines[i + 1] && /^\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
                    const tableLines = [line, lines[i + 1]];
                    let j = i + 2;
                    while (j < lines.length && isTableRow(lines[j])) { tableLines.push(lines[j]); j++; }
                    const parseRow = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
                    const header = parseRow(tableLines[0]);
                    const rows = tableLines.slice(2).map(parseRow);
                    blocks.push(
                        <div key={key++} className="overflow-x-auto my-3 rounded-xl border border-nb-border/60">
                            <table className="w-full text-xs border-collapse">
                                <thead>
                                    <tr className="bg-nb-hover/60">
                                        {header.map((h, hi) => (
                                            <th key={hi} className="text-left font-semibold text-nb-text-main px-3 py-2 border-b border-nb-border/60 whitespace-normal">
                                                <MarkdownInline text={h} />
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows.map((r, ri) => (
                                        <tr key={ri} className={ri % 2 === 0 ? 'bg-nb-card' : 'bg-nb-panel'}>
                                            {r.map((c, ci) => (
                                                <td key={ci} className="px-3 py-2 align-top text-nb-text-main/90 border-b border-nb-border/30 whitespace-normal">
                                                    <MarkdownInline text={c} />
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    );
                    i = j;
                    continue;
                }

                if (isListItem(line)) {
                    const ordered = /^\s*\d+[.)]\s+/.test(line);
                    const items = [];
                    while (i < lines.length && isListItem(lines[i])) {
                        items.push(lines[i].replace(/^\s*([-•*]|\d+[.)])\s+/, ''));
                        i++;
                    }
                    const ListTag = ordered ? 'ol' : 'ul';
                    blocks.push(
                        <ListTag key={key++} className={`${ordered ? 'list-decimal' : 'list-disc'} list-outside pl-5 space-y-1 my-2 text-sm text-nb-text-main/90`}>
                            {items.map((it, ii) => <li key={ii}><MarkdownInline text={it} /></li>)}
                        </ListTag>
                    );
                    continue;
                }

                const paraLines = [line];
                i++;
                while (i < lines.length && lines[i].trim() !== '' && !isHeading(lines[i]) && !isHr(lines[i]) && !isTableRow(lines[i]) && !isListItem(lines[i])) {
                    paraLines.push(lines[i]);
                    i++;
                }
                blocks.push(
                    <p key={key++} className="text-sm text-nb-text-main/90 leading-relaxed my-2">
                        {paraLines.map((pl, pi) => (
                            <React.Fragment key={pi}>
                                <MarkdownInline text={pl} />
                                {pi < paraLines.length - 1 && <br />}
                            </React.Fragment>
                        ))}
                    </p>
                );
            }

            return blocks;
        }

        function NotebookApp() {
            const [inputQuery, setInputQuery] = useState('');
            const [sources, setSources] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [notebookTitle, setNotebookTitle] = useState('Notebook sans titre');
            
            // Nouvel état pour l'heure en haut
            const [currentTime, setCurrentTime] = useState(new Date());

            // Détecte le fuseau horaire du visiteur (donc "le lieu") directement dans le navigateur,
            // sans demande de permission ni service externe.
            const [placeLabel, setPlaceLabel] = useState('');
            useEffect(() => {
                try {
                    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; // ex: "Africa/Tunis"
                    const city = tz.split('/').pop().replace(/_/g, ' ');
                    setPlaceLabel(city);
                } catch (e) {
                    setPlaceLabel('');
                }
            }, []);

            // États pour les fonctionnalités (Dictée vocale, Synthèse vocale, Scan papier/OCR)
            const [isListening, setIsListening] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [activeSpeechIndex, setActiveSpeechIndex] = useState(null);
            const [isScanning, setIsScanning] = useState(false);
            const fileInputRef = useRef(null);
            const docFileInputRef = useRef(null);

            // ================= CONFIGURATION DU PROXY API =================
            // Aucune clé API n'est stockée ici. L'app appelle un petit serveur
            // proxy (Cloudflare Worker) qui détient les vraies clés côté serveur.
            // Voir /proxy/README.md pour le déploiement.
            const DEFAULT_PROXY_URL = ""; // ex: "https://notebook-ia-proxy.votre-compte.workers.dev"
            const DEFAULT_PROXY_TOKEN = ""; // optionnel, doit correspondre au secret PROXY_TOKEN du Worker

            // ================= PARTAGE RÉEL DES NOTEBOOKS (Supabase) =================
            // 1) Créez un projet gratuit sur https://supabase.com
            // 2) Dans l'éditeur SQL du projet, exécutez le script de création de table fourni
            //    (table "notebooks_partages" + policies RLS publiques lecture/écriture).
            // 3) Dans Project Settings > API, copiez "Project URL" et la clé "anon public"
            //    et collez-les ci-dessous. Ainsi le partage fonctionnera pour TOUT LE MONDE
            //    qui ouvre l'application (pas seulement vous), sans rien configurer.
            const DEFAULT_SUPABASE_URL = "";       // ex: "https://abcdefghij.supabase.co"
            const DEFAULT_SUPABASE_ANON_KEY = "";  // clé "anon public" (jamais la "service_role")

            const [proxyUrl, setProxyUrl] = useState(() => {
                try { return localStorage.getItem('nb_proxy_url') || DEFAULT_PROXY_URL; } catch (e) { return DEFAULT_PROXY_URL; }
            });
            const [proxyToken, setProxyToken] = useState(() => {
                try { return localStorage.getItem('nb_proxy_token') || DEFAULT_PROXY_TOKEN; } catch (e) { return DEFAULT_PROXY_TOKEN; }
            });

            const [selectedProvider, setSelectedProvider] = useState('auto'); // 'auto' | 'gemini' | 'openai' | 'groq'
            const [isApiModalOpen, setIsApiModalOpen] = useState(false);
            const [proxyUrlInput, setProxyUrlInput] = useState(proxyUrl);
            const [proxyTokenInput, setProxyTokenInput] = useState(proxyToken);
            const isProxyConfigured = Boolean(proxyUrl);
            const [apiStatusMessage, setApiStatusMessage] = useState(isProxyConfigured ? 'Prêt (via proxy sécurisé)' : 'Proxy non configuré');
            const [isTestingApi, setIsTestingApi] = useState(false);
            const [apiTestResult, setApiTestResult] = useState(null);

            // --- Configuration Supabase (partage réel des notebooks) ---
            const [supabaseUrl, setSupabaseUrl] = useState(() => {
                try { return localStorage.getItem('nb_supabase_url') || DEFAULT_SUPABASE_URL; } catch (e) { return DEFAULT_SUPABASE_URL; }
            });
            const [supabaseAnonKey, setSupabaseAnonKey] = useState(() => {
                try { return localStorage.getItem('nb_supabase_key') || DEFAULT_SUPABASE_ANON_KEY; } catch (e) { return DEFAULT_SUPABASE_ANON_KEY; }
            });
            const [supabaseUrlInput, setSupabaseUrlInput] = useState(supabaseUrl);
            const [supabaseKeyInput, setSupabaseKeyInput] = useState(supabaseAnonKey);
            const isSupabaseConfigured = Boolean(supabaseUrl && supabaseAnonKey);

            useEffect(() => {
                setProxyUrlInput(proxyUrl);
            }, [proxyUrl]);

            useEffect(() => {
                setProxyTokenInput(proxyToken);
            }, [proxyToken]);

            useEffect(() => {
                setSupabaseUrlInput(supabaseUrl);
            }, [supabaseUrl]);

            useEffect(() => {
                setSupabaseKeyInput(supabaseAnonKey);
            }, [supabaseAnonKey]);

            const saveApiKeysFromModal = () => {
                const newProxyUrl = proxyUrlInput.trim().replace(/\/+$/, '');
                const newProxyToken = proxyTokenInput.trim();
                setProxyUrl(newProxyUrl);
                setProxyToken(newProxyToken);

                const newSupabaseUrl = supabaseUrlInput.trim().replace(/\/+$/, '');
                const newSupabaseKey = supabaseKeyInput.trim();
                setSupabaseUrl(newSupabaseUrl);
                setSupabaseAnonKey(newSupabaseKey);

                try {
                    localStorage.setItem('nb_proxy_url', newProxyUrl);
                    localStorage.setItem('nb_proxy_token', newProxyToken);
                    localStorage.setItem('nb_supabase_url', newSupabaseUrl);
                    localStorage.setItem('nb_supabase_key', newSupabaseKey);
                } catch (e) {}
                setApiStatusMessage(newProxyUrl ? 'Configuré (via proxy sécurisé)' : 'Proxy non configuré');
                setIsApiModalOpen(false);
            };

            const compileSourcesContext = () => {
                if (!sources || sources.length === 0) return "";
                return sources.map((s, idx) => {
                    const text = s.content ? s.content : `[Fichier : ${s.name}]`;
                    return `### Source ${idx + 1} : ${s.name}\n${text}`;
                }).join('\n\n---\n\n');
            };

            // Appelle le proxy sécurisé (le Worker détient les vraies clés, jamais le navigateur)
            const callProxy = async (route, body) => {
                if (!proxyUrl) {
                    throw new Error("Proxy non configuré : ouvrez les paramètres API et renseignez l'URL du proxy.");
                }
                const res = await fetch(`${proxyUrl.replace(/\/+$/, '')}/${route}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(proxyToken ? { 'X-Proxy-Token': proxyToken } : {})
                    },
                    body: JSON.stringify(body)
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data?.error || `Erreur proxy HTTP ${res.status}`);
                }
                return data;
            };

            // Fonction unifiée pour appeler l'IA. Les vraies clés vivent uniquement
            // côté serveur (Worker) ; le navigateur ne voit jamais que l'URL du proxy.
            const callAI = async (prompt, systemInstruction = '') => {
                let lastError = null;

                // 1. Gemini (via proxy)
                if (selectedProvider === 'auto' || selectedProvider === 'gemini') {
                    try {
                        setApiStatusMessage('Requête Gemini (via proxy)...');
                        const data = await callProxy('gemini', {
                            contents: [
                                {
                                    role: 'user',
                                    parts: [{ text: (systemInstruction ? systemInstruction + '\n\n' : '') + prompt }]
                                }
                            ],
                            generationConfig: { temperature: 0.7, maxOutputTokens: 2500 }
                        });
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            setApiStatusMessage('Actif · Gemini 2.5 Flash (via proxy)');
                            return text;
                        }
                        lastError = new Error(data?.error?.message || 'Gemini: réponse vide');
                    } catch (e) {
                        console.warn('Gemini (proxy) erreur :', e);
                        lastError = e;
                    }
                }

                // 2. OpenAI (via proxy)
                if (selectedProvider === 'auto' || selectedProvider === 'openai') {
                    try {
                        setApiStatusMessage('Requête OpenAI (via proxy)...');
                        const data = await callProxy('openai', {
                            model: 'gpt-4o-mini',
                            messages: [
                                ...(systemInstruction ? [{ role: 'system', content: systemInstruction }] : []),
                                { role: 'user', content: prompt }
                            ],
                            max_tokens: 2048,
                            temperature: 0.7
                        });
                        const text = data?.choices?.[0]?.message?.content;
                        if (text) {
                            setApiStatusMessage('Actif · OpenAI GPT-4o-mini (via proxy)');
                            return text;
                        }
                        lastError = new Error(data?.error?.message || 'OpenAI: réponse vide');
                    } catch (e) {
                        console.warn('OpenAI (proxy) erreur :', e);
                        lastError = e;
                    }
                }

                // 3. Groq (via proxy)
                if (selectedProvider === 'auto' || selectedProvider === 'groq') {
                    try {
                        setApiStatusMessage('Requête Groq (via proxy)...');
                        const data = await callProxy('groq', {
                            model: 'qwen/qwen3.8-27b',
                            messages: [
                                ...(systemInstruction ? [{ role: 'system', content: systemInstruction }] : []),
                                { role: 'user', content: prompt }
                            ],
                            max_tokens: 2048,
                            temperature: 0.7
                        });
                        const text = data?.choices?.[0]?.message?.content;
                        if (text) {
                            setApiStatusMessage('Actif · Groq Qwen (via proxy)');
                            return text;
                        }
                        lastError = new Error(data?.error?.message || 'Groq: réponse vide');
                    } catch (e) {
                        console.warn('Groq (proxy) erreur :', e);
                        lastError = e;
                    }
                }

                setApiStatusMessage('Erreur API');
                throw lastError || new Error("Le proxy n'a retourné aucune réponse exploitable.");
            };

            const testApiConnection = async () => {
                setIsTestingApi(true);
                setApiTestResult(null);
                try {
                    const res = await callAI("Réponds en une phrase courte confirmant que la connexion à l'API est réussie.");
                    setApiTestResult({ success: true, text: res });
                } catch (err) {
                    setApiTestResult({ success: false, text: err.message || "Erreur lors du test." });
                } finally {
                    setIsTestingApi(false);
                }
            };

            // États pour l'outil d'amélioration des icônes (Studio)
            const [iconStyle, setIconStyle] = useState('vector'); // 'vector' | 'emoji'
            const [iconColor, setIconColor] = useState('#a8c7fa');
            const [isIconModalOpen, setIsIconModalOpen] = useState(false);

            // États pour le menu utilisateur / déconnexion
            const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);
            const [isLogoutModalOpen, setIsLogoutModalOpen] = useState(false);
            const [isLoggedOut, setIsLoggedOut] = useState(false);

            // États pour le partage du notebook
            const [isShareModalOpen, setIsShareModalOpen] = useState(false);
            const [shareUrl, setShareUrl] = useState('');
            const [isLinkCopied, setIsLinkCopied] = useState(false);

            // --- Mode Focus : minuteur Pomodoro + sons d'ambiance (pluie, café, lofi) ---
            const [isFocusOpen, setIsFocusOpen] = useState(false);
            const POMO_DURATIONS = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
            const [pomoMode, setPomoMode] = useState('focus');
            const [timeLeft, setTimeLeft] = useState(POMO_DURATIONS.focus);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [pomoCount, setPomoCount] = useState(0);
            const [activeSound, setActiveSound] = useState(null);
            const [soundVolume, setSoundVolume] = useState(0.5);
            const audioRef = useRef({ ctx: null, nodes: [], lofiTimer: null });
            const [customUrl, setCustomUrl] = useState('');
            const customAudioRef = useRef(null);

            const formatTime = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

            useEffect(() => {
                if (!isTimerRunning) return;
                const id = setInterval(() => setTimeLeft(prev => (prev > 0 ? prev - 1 : 0)), 1000);
                return () => clearInterval(id);
            }, [isTimerRunning]);

            useEffect(() => {
                if (timeLeft !== 0 || !isTimerRunning) return;
                playChime();
                setIsTimerRunning(false);
                if (pomoMode === 'focus') {
                    const next = pomoCount + 1;
                    setPomoCount(next);
                    const nextMode = next % 4 === 0 ? 'long' : 'short';
                    setPomoMode(nextMode);
                    setTimeLeft(POMO_DURATIONS[nextMode]);
                } else {
                    setPomoMode('focus');
                    setTimeLeft(POMO_DURATIONS.focus);
                }
            }, [timeLeft]);

            useEffect(() => {
                const master = audioRef.current.nodes[0];
                if (master && master.gain) master.gain.value = soundVolume;
                if (customAudioRef.current) customAudioRef.current.volume = soundVolume;
            }, [soundVolume]);

            const toggleTimer = () => setIsTimerRunning(r => !r);
            const resetTimer = () => { setIsTimerRunning(false); setTimeLeft(POMO_DURATIONS[pomoMode]); };
            const switchPomoMode = (mode) => { setIsTimerRunning(false); setPomoMode(mode); setTimeLeft(POMO_DURATIONS[mode]); };

            const getAudioCtx = () => {
                if (!audioRef.current.ctx) audioRef.current.ctx = new (window.AudioContext || window.webkitAudioContext)();
                return audioRef.current.ctx;
            };

            const playChime = () => {
                try {
                    const ctx = getAudioCtx();
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.type = 'sine'; o.frequency.value = 880;
                    g.gain.setValueAtTime(0.2, ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(); o.stop(ctx.currentTime + 1);
                } catch (e) {}
            };

            const makeNoiseBuffer = (ctx) => {
                const bufferSize = ctx.sampleRate * 2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                return buffer;
            };

            const stopAmbientSound = () => {
                audioRef.current.nodes.forEach(n => { try { n.stop && n.stop(); n.disconnect && n.disconnect(); } catch (e) {} });
                audioRef.current.nodes = [];
                if (audioRef.current.lofiTimer) { clearTimeout(audioRef.current.lofiTimer); audioRef.current.lofiTimer = null; }
            };

            const playAmbientSound = (type) => {
                stopAmbientSound();
                const ctx = getAudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const master = ctx.createGain();
                master.gain.value = soundVolume;
                master.connect(ctx.destination);
                audioRef.current.nodes.push(master);

                if (type === 'rain') {
                    const noise = ctx.createBufferSource();
                    noise.buffer = makeNoiseBuffer(ctx); noise.loop = true;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass'; filter.frequency.value = 3200; filter.Q.value = 0.6;
                    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.15;
                    const lfoGain = ctx.createGain(); lfoGain.gain.value = 800;
                    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
                    noise.connect(filter); filter.connect(master);
                    noise.start(); lfo.start();
                    audioRef.current.nodes.push(noise, filter, lfo, lfoGain);
                } else if (type === 'cafe') {
                    const noise = ctx.createBufferSource();
                    noise.buffer = makeNoiseBuffer(ctx); noise.loop = true;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.value = 900;
                    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.08;
                    const lfoGain = ctx.createGain(); lfoGain.gain.value = 200;
                    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
                    noise.connect(filter); filter.connect(master);
                    noise.start(); lfo.start();
                    audioRef.current.nodes.push(noise, filter, lfo, lfoGain);
                } else if (type === 'lofi') {
                    const crackle = ctx.createBufferSource();
                    crackle.buffer = makeNoiseBuffer(ctx); crackle.loop = true;
                    const crackleFilter = ctx.createBiquadFilter();
                    crackleFilter.type = 'highpass'; crackleFilter.frequency.value = 4000;
                    const crackleGain = ctx.createGain(); crackleGain.gain.value = 0.15;
                    crackle.connect(crackleFilter); crackleFilter.connect(crackleGain); crackleGain.connect(master);
                    crackle.start();
                    audioRef.current.nodes.push(crackle, crackleFilter, crackleGain);

                    const chords = [[261.6, 329.6, 392, 493.9], [220, 277.2, 329.6, 415.3], [174.6, 220, 261.6, 349.2], [196, 246.9, 293.7, 349.2]];
                    let chordIndex = 0;
                    const scheduleChord = () => {
                        const now = ctx.currentTime;
                        const chordGain = ctx.createGain();
                        chordGain.gain.setValueAtTime(0, now);
                        chordGain.gain.linearRampToValueAtTime(0.09, now + 1);
                        chordGain.gain.linearRampToValueAtTime(0, now + 3.6);
                        chordGain.connect(master);
                        audioRef.current.nodes.push(chordGain);
                        chords[chordIndex % chords.length].forEach(freq => {
                            const o = ctx.createOscillator();
                            o.type = 'triangle'; o.frequency.value = freq;
                            const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1200;
                            o.connect(lp); lp.connect(chordGain);
                            o.start(now); o.stop(now + 3.8);
                            audioRef.current.nodes.push(o, lp);
                        });
                        chordIndex++;
                        audioRef.current.lofiTimer = setTimeout(scheduleChord, 4000);
                    };
                    scheduleChord();
                }
                setActiveSound(type);
            };

            const toggleAmbientSound = (type) => {
                if (customAudioRef.current) customAudioRef.current.pause();
                if (activeSound === type) { stopAmbientSound(); setActiveSound(null); }
                else playAmbientSound(type);
            };

            const toggleCustomSound = () => {
                if (!customUrl.trim()) return;
                if (activeSound === 'custom') {
                    if (customAudioRef.current) customAudioRef.current.pause();
                    setActiveSound(null);
                    return;
                }
                stopAmbientSound();
                if (customAudioRef.current) {
                    customAudioRef.current.src = customUrl.trim();
                    customAudioRef.current.loop = true;
                    customAudioRef.current.volume = soundVolume;
                    customAudioRef.current.play().catch(() => {
                        alert("Impossible de lire ce lien. Utilisez un lien direct vers un fichier audio (.mp3, .wav, .ogg) — les liens YouTube ou Spotify ne fonctionnent pas ici.");
                        setActiveSound(null);
                    });
                }
                setActiveSound('custom');
            };

            const [isSharing, setIsSharing] = useState(false);
            const [shareError, setShareError] = useState('');

            const handleShare = async () => {
                setShareError('');
                setShareUrl('');
                setIsLinkCopied(false);
                setIsShareModalOpen(true);

                if (!isSupabaseConfigured) {
                    setShareError("Le partage réel n'est pas encore configuré : ouvrez « Clés API » et renseignez l'URL + la clé « anon public » de votre projet Supabase.");
                    return;
                }

                setIsSharing(true);
                try {
                    const slug = notebookTitle
                        .toLowerCase()
                        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                        .replace(/[^a-z0-9]+/g, '-')
                        .replace(/(^-|-$)/g, '') || 'notebook';
                    const shareId = `${slug}-${Math.random().toString(36).slice(2, 8)}`;

                    const payload = {
                        id: shareId,
                        title: notebookTitle,
                        data: { notebookTitle, sources, chatHistory, studioResults }
                    };

                    const res = await fetch(`${supabaseUrl}/rest/v1/notebooks_partages`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': supabaseAnonKey,
                            'Authorization': `Bearer ${supabaseAnonKey}`,
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errBody = await res.text().catch(() => '');
                        throw new Error(errBody || `Erreur HTTP ${res.status}`);
                    }

                    const url = `${window.location.origin}${window.location.pathname}?share=${shareId}`;
                    setShareUrl(url);
                } catch (err) {
                    setShareError(`Échec de l'enregistrement sur Supabase : ${err.message || 'erreur inconnue'}. Vérifiez la table "notebooks_partages" et ses règles RLS.`);
                } finally {
                    setIsSharing(false);
                }
            };

            const copyShareLink = async () => {
                try {
                    await navigator.clipboard.writeText(shareUrl);
                } catch (e) {
                    // repli si le presse-papiers est indisponible
                }
                setIsLinkCopied(true);
                setTimeout(() => setIsLinkCopied(false), 2000);
            };

            // --- ESPACE DE GÉNÉRATION DE CHAQUE CARTE STUDIO ---
            // Chaque outil (audio, vidéo, carte mentale, rapport, etc.) possède son propre
            // « espace » de résultat, prêt à recevoir le contenu renvoyé par votre API.
            const [activeStudioTool, setActiveStudioTool] = useState(null); // outil actuellement ouvert
            const [studioResults, setStudioResults] = useState({});         // { toolId: contenu généré }
            const [isGeneratingStudio, setIsGeneratingStudio] = useState(false);

            const openStudioTool = (tool) => setActiveStudioTool(tool);

            const [isStudioResultCopied, setIsStudioResultCopied] = useState(false);
            const copyStudioResult = async () => {
                const text = activeStudioTool ? studioResults[activeStudioTool.id] : '';
                if (!text) return;
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {}
                setIsStudioResultCopied(true);
                setTimeout(() => setIsStudioResultCopied(false), 2000);
            };

            const generateStudioContent = async () => {
                if (!activeStudioTool || isGeneratingStudio) return;
                setIsGeneratingStudio(true);

                try {
                    const sourcesContext = compileSourcesContext();
                    let toolInstruction = "";
                    switch (activeStudioTool.id) {
                        case 'audio':
                            toolInstruction = "Rédige un script complet et passionnant de résumé audio (format podcast de 2 minutes avec deux animateurs dynamiques, Alex et Sam). Ils synthétisent de manière vivante, accessible et rythmée les enseignements clés des sources.";
                            break;
                        case 'video':
                            toolInstruction = "Génère un script et storyboard vidéo explicatif complet (Introduction visuelle, 3 séquences thématiques avec description visuelle + voix off, et Conclusion mémorable) basé sur les sources.";
                            break;
                        case 'mind':
                            toolInstruction = "Construis une carte mentale textuelle arborescente détaillée et parfaitement hiérarchisée des concepts clés (avec branches principales, sous-branches, puces et émojis explicatifs).";
                            break;
                        case 'report':
                            toolInstruction = "Rédige un rapport d'analyse exécutif et professionnel complet comprenant : Titre, Contexte & Résumé exécutif, Analyse détaillée des piliers clés, et Recommandations stratégiques / Conclusion.";
                            break;
                        case 'flash':
                            toolInstruction = "Crée 5 fiches d'étude (Flashcards) synthétiques sous le format :\n- Fiche 1 :\n  • Question / Concept : ...\n  • Réponse clé : ...\n(jusqu'à 5 fiches claires).";
                            break;
                        case 'quiz':
                            toolInstruction = "Génère un quiz interactif de 4 questions à choix multiples (QCM). Pour chaque question, propose 4 choix (A, B, C, D), indique clairement la bonne réponse et donne une explication pédagogique.";
                            break;
                        case 'info':
                            toolInstruction = "Conçois le contenu textuel et les métriques clés d'une infographie percutante résumant les statistiques, étapes et concepts majeurs des sources.";
                            break;
                        case 'data':
                            toolInstruction = "Extrais et structure les données, faits, statistiques et éléments clés sous forme d'un tableau Markdown clair, lisible et bien ordonné.";
                            break;
                        default:
                            toolInstruction = `Génère une analyse approfondie et structurée pour l'outil : ${activeStudioTool.title}.`;
                    }

                    const systemPrompt = `Tu es l'assistant d'apprentissage avancé de Notebook IA.
${sourcesContext ? `Voici les sources documentaires de l'utilisateur :\n\n${sourcesContext}` : `Sujet du notebook : "${notebookTitle}". Génère un contenu riche et pertinent sur ce thème.`}
Réponds toujours en français, avec une mise en page soignée (Markdown structuré, puces, sections distinctes).`;

                    const generated = await callAI(toolInstruction, systemPrompt);
                    setStudioResults(prev => ({
                        ...prev,
                        [activeStudioTool.id]: generated
                    }));
                } catch (err) {
                    setStudioResults(prev => ({
                        ...prev,
                        [activeStudioTool.id]: `⚠️ Erreur de génération : ${err.message || 'Impossible de joindre l’API'}.\nVérifiez vos clés API dans le menu « Clés API » en haut.`
                    }));
                } finally {
                    setIsGeneratingStudio(false);
                }
            };

            const [chatHistory, setChatHistory] = useState([
                { type: 'ai', text: 'Bonjour ! Je suis votre assistant personnel. Glissez-déposez vos fichiers à gauche ou ajoutez des sources pour commencer l’analyse.' }
            ]);

            // --- Chargement d'un notebook partagé (lien ?share=xxxx) en lecture ---
            const [isViewingSharedNotebook, setIsViewingSharedNotebook] = useState(false);
            const [isLoadingSharedNotebook, setIsLoadingSharedNotebook] = useState(false);
            const [sharedLoadError, setSharedLoadError] = useState('');

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const shareId = params.get('share');
                if (!shareId) return;

                if (!supabaseUrl || !supabaseAnonKey) {
                    setSharedLoadError("Ce lien pointe vers un notebook partagé, mais cette copie de l'application n'a pas de configuration Supabase (DEFAULT_SUPABASE_URL / DEFAULT_SUPABASE_ANON_KEY vides dans le code).");
                    return;
                }

                setIsLoadingSharedNotebook(true);
                fetch(`${supabaseUrl}/rest/v1/notebooks_partages?id=eq.${encodeURIComponent(shareId)}&select=*`, {
                    headers: {
                        'apikey': supabaseAnonKey,
                        'Authorization': `Bearer ${supabaseAnonKey}`
                    }
                })
                    .then(res => {
                        if (!res.ok) throw new Error(`Erreur HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(rows => {
                        if (Array.isArray(rows) && rows.length > 0 && rows[0].data) {
                            const nb = rows[0].data;
                            if (nb.notebookTitle) setNotebookTitle(nb.notebookTitle);
                            if (Array.isArray(nb.sources)) setSources(nb.sources);
                            if (Array.isArray(nb.chatHistory)) setChatHistory(nb.chatHistory);
                            if (nb.studioResults) setStudioResults(nb.studioResults);
                            setIsViewingSharedNotebook(true);
                        } else {
                            setSharedLoadError("Ce notebook partagé est introuvable : le lien est peut-être invalide ou a expiré.");
                        }
                    })
                    .catch(() => setSharedLoadError("Impossible de charger le notebook partagé (réseau, ou règles RLS Supabase manquantes)."))
                    .finally(() => setIsLoadingSharedNotebook(false));
            }, []); // une seule fois, au chargement de la page

            // Quitte le mode lecture seule et repasse en édition locale normale
            const handleDuplicateSharedNotebook = () => {
                setIsViewingSharedNotebook(false);
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('share');
                    window.history.replaceState({}, '', url.toString());
                } catch (e) {}
            };

            // Nom d'utilisateur récupéré depuis la page de connexion séparée
            // (transmis via l'URL : ?user=Jean, ou stocké par la page de login dans localStorage sous 'nb_username')
            const [currentUsername, setCurrentUsername] = useState('Utilisateur');

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const fromUrl = params.get('user') || params.get('username') || params.get('name');

                try { fromStorage = localStorage.getItem('nb_username'); } catch (e) {}
                const found = fromUrl || fromStorage;
                if (found) {
                    setCurrentUsername(found);
                    try { localStorage.setItem('nb_username', found); } catch (e) {}
                }
            }, []);

            const handleBackToLogin = () => {
                if (document.referrer && document.referrer !== window.location.href) {
                    window.location.href = document.referrer;
                } else {
                    window.history.back();
                }
            };

            // Mettre à jour l'heure chaque seconde
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Fonction pour réinitialiser / créer un nouveau notebook
            const handleNewNotebook = () => {
                if (sources.length > 0 || chatHistory.length > 1) {
                    const confirmNew = window.confirm("Voulez-vous créer un nouveau notebook ? Les modifications non sauvegardées seront réinitialisées.");
                    if (!confirmNew) return;
                }
                setSources([]);
                setChatHistory([
                    { type: 'ai', text: 'Nouveau notebook initialisé ! Glissez-déposez vos fichiers à gauche ou ajoutez des sources pour commencer.' }
                ]);
                setInputQuery('');
                setNotebookTitle('Notebook sans titre');
                window.speechSynthesis.cancel();
                setIsSpeaking(false);
                setActiveSpeechIndex(null);
            };

            // Icône principale de l'application (cerveau + diplôme)
            const HumanRobotIcon = ({ size = 36, className = "mr-2 inline-block" }) => (
                <img

            // --- OUTIL D'AMÉLIORATION DES ICÔNES ---

                    case 'sparkles': return <><path d="M12 3l1.4 4.3L18 9l-4.6 1.7L12 15l-1.4-4.3L6 9l4.6-1.7z"/><path d="M19 15l.6 1.9L21 18l-1.9.6L19 21l-.6-1.9L16 18l1.9-.6z"/></>;

                    case 'bulb': return <><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a6 6 0 0 0-4 10.5c.6.5 1 1.3 1 2.5h6c0-1.2.4-2 1-2.5A6 6 0 0 0 12 2z"/></>;
