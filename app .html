<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverNote - Votre partenaire de recherche optimisé par l'IA</title>
    <link rel="icon" type="image/x-icon" href="assets/app_logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        // Composant d'Écran de Chargement avec Animation
        function LoadingScreen({ onLoaded }) {
            const [progress, setProgress] = React.useState(0);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    setProgress((oldProgress) => {
                        if (oldProgress >= 100) {
                            clearInterval(interval);
                            setTimeout(onLoaded, 400); // Disparition fluide une fois chargé à 100%
                            return 100;
                        }
                        return oldProgress + 20;
                    });
                }, 150);
                return () => clearInterval(interval);
            }, [onLoaded]);

            return (
                <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-700">
                    <div className="relative mb-8">
                        <div className="absolute -inset-4 bg-gradient-to-r from-blue-600 to-teal-500 rounded-full blur-xl opacity-50 animate-pulse"></div>
                        <img src="assets/app_logo.png" alt="EverNote Logo" className="w-20 h-20 object-contain relative z-10 animate-bounce" />
                    </div>
                    <h2 className="text-2xl font-bold tracking-tight text-white mb-2">EverNote</h2>
                    <p className="text-sm text-slate-400 mb-6">Préparation de votre assistant de recherche...</p>
                    
                    <div className="w-64 h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                        <div 
                            className="h-full bg-gradient-to-r from-blue-500 to-teal-400 transition-all duration-200 ease-out rounded-full"
                            style={{ width: `${progress}%` }}
                        ></div>
                    </div>
                    <span className="text-xs text-slate-500 mt-3 font-mono">{progress}%</span>
                </div>
            );
        }

        function Header() {
            const [isMenuOpen, setIsMenuOpen] = React.useState(false);

            return (
                <header className="fixed top-0 left-0 right-0 z-45 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
                    <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                        <div className="flex items-center space-x-3 cursor-pointer">
                            <img src="assets/app_logo.png" alt="EverNote Logo" className="w-10 h-10 object-contain drop-shadow-lg" />
                            <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">EverNote</span>
                        </div>
                        <nav className="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
                            <a href="#fonctionnement" className="hover:text-white transition-colors">Fonctionnement</a>
                            <a href="#audio" className="hover:text-white transition-colors">Résumés Audio</a>
                            <a href="#explore" className="hover:text-white transition-colors">Explorer</a>
                            <a href="#demo-video" className="hover:text-white transition-colors">Vidéo & Animation</a>
                            <a href="#hackathon-ideas" className="text-blue-400 hover:text-blue-300 transition-colors font-semibold">✨ Idées Hackathon</a>
                        </nav>
                        <div className="relative">
                            <button 
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                                className="p-2 rounded-full bg-slate-900 border border-slate-700 hover:bg-slate-800 transition-colors flex items-center justify-center shadow-md cursor-pointer"
                            >
                                <svg className="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </button>
                            
                            {isMenuOpen && (
                                <div className="absolute right-0 mt-3 w-48 rounded-xl shadow-2xl bg-slate-900 border border-slate-700 overflow-hidden z-50">
                                    <div className="py-1">
                                        <a href="login.html" className="block px-4 py-3 text-sm text-slate-300 hover:bg-blue-600 hover:text-white transition-colors border-b border-slate-800">Log in</a>
                                        <a href="signup.html" className="block px-4 py-3 text-sm text-slate-300 hover:bg-blue-600 hover:text-white transition-colors">Sign up</a>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </header>
            );
        }

        function Hero() {
            return (
                <section className="relative pt-32 pb-20 md:pt-44 md:pb-28 overflow-hidden">
                    <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[350px] bg-gradient-to-tr from-blue-600/20 via-indigo-500/20 to-teal-400/20 blur-[120px] rounded-full pointer-events-none"></div>
                    <div className="max-w-5xl mx-auto px-6 text-center relative z-10">
                        <span className="px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs text-blue-400 mb-6 inline-block">Propulsé par les derniers modèles Gemini</span>
                        <h1 className="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white mb-6 leading-tight">
                            Vous allez <span className="bg-gradient-to-r from-blue-400 via-indigo-300 to-teal-300 bg-clip-text text-transparent">tout comprendre</span>
                        </h1>
                        <p className="text-base sm:text-lg text-slate-400 max-w-2xl mx-auto mb-10">
                            Votre partenaire de recherche et de réflexion, basé sur les informations auxquelles vous faites confiance.
                        </p>
                        <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                            <a href="#explore" className="w-full sm:w-auto px-8 py-4 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-500 shadow-lg shadow-blue-600/30 transition-all duration-200">
                                Essayer maintenant
                            </a>
                            <a href="#fonctionnement" className="w-full sm:w-auto px-8 py-4 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 font-semibold hover:bg-slate-800 hover:text-white transition-all duration-200">
                                En savoir plus
                            </a>
                        </div>
                    </div>
                </section>
            );
        }

        function FonctionnementWithVideo() {
            return (
                <section id="fonctionnement" className="py-20 bg-slate-900/30 border-t border-slate-900">
                    <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                        <div>
                            <h2 className="text-3xl font-bold tracking-tight text-white mb-6">Fonctionnement & Démo</h2>
                            <p className="text-slate-300 leading-relaxed mb-6">
                                EverNote a été conçu pour vous aider à utiliser vos notes plus efficacement. Posez une question sur n'importe quel sujet. Les réponses que vous obtenez sont toujours ancrées dans les informations que vous fournissez.
                            </p>
                            <div className="space-y-4 text-sm text-slate-400">
                                <div className="flex items-center space-x-3">
                                    <div className="w-2 h-2 rounded-full bg-blue-500"></div>
                                    <span>Centralisation des PDF, sites web et vidéos YouTube</span>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <div className="w-2 h-2 rounded-full bg-indigo-500"></div>
                                    <span>Traçabilité instantanée des sources d'information</span>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl relative shadow-2xl overflow-hidden group">
                            <div className="absolute inset-0 bg-gradient-to-r from-blue-500/10 to-teal-500/15 pointer-events-none"></div>
                            <div className="relative rounded-xl overflow-hidden aspect-video bg-slate-950 flex items-center justify-center border border-slate-800">
                                <iframe 
                                    className="w-full h-full object-cover"
                                    src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                                    title="Démo EverNote"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen>
                                </iframe>
                            </div>
                            <p className="text-xs text-center text-slate-400 mt-3">▶️ Regardez la vidéo de présentation des fonctionnalités clés</p>
                        </div>
                    </div>
                </section>
            );
        }

        function AudioSection() {
            return (
                <section id="audio" className="py-20 border-t border-slate-900">
                    <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl">
                            <div className="flex items-center justify-between mb-4">
                                <div className="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">⏸</div>
                                <div className="text-xs text-slate-400">1:41 / 3:01</div>
                            </div>
                            <div className="w-full bg-slate-800 h-2 rounded-full mb-6 overflow-hidden">
                                <div className="bg-blue-500 w-1/2 h-full rounded-full"></div>
                            </div>
                            <div className="flex justify-end space-x-4 text-sm text-slate-400">
                                <span>👍 Utile</span>
                                <span>👎 À améliorer</span>
                            </div>
                        </div>
                        <div>
                            <h2 className="text-3xl font-bold tracking-tight text-white mb-4">Résumés audio</h2>
                            <p className="text-slate-300 leading-relaxed">
                                Écoutez un résumé de vos sources lu à voix haute grâce aux résumés audio interactifs. Idéal pour assimiler vos cours ou rapports en déplacement.
                            </p>
                        </div>
                    </div>
                </section>
            );
        }

        function ExploreSection() {
            return (
                <section id="explore" className="py-20 bg-slate-900/30 border-t border-slate-900">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="max-w-xl mb-12">
                            <h2 className="text-3xl font-bold tracking-tight text-white mb-4">Découvrez une sélection de notebooks publics</h2>
                            <p className="text-slate-400">Si vous ne savez pas par où commencer, essayez l'un de ces notebooks publics. Posez des questions, générez des résumés et trouvez l'inspiration pour créer vos propres notebooks.</p>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            <a href="page_principale.html" className="bg-slate-900 border border-slate-800 p-6 rounded-2xl hover:border-blue-500 hover:shadow-lg hover:shadow-blue-500/10 hover:-translate-y-1 transition-all duration-200 cursor-pointer block">
                                <span className="text-2xl mb-4 block">🤖</span>
                                <h3 className="text-lg font-semibold text-white mb-2">Les secrets des super-aînés</h3>
                                <p className="text-xs text-slate-400">17 sources</p>
                            </a>
                            <a href="page_principale.html" className="bg-slate-900 border border-slate-800 p-6 rounded-2xl hover:border-blue-500 hover:shadow-lg hover:shadow-blue-500/10 hover:-translate-y-1 transition-all duration-200 cursor-pointer block">
                                <span className="text-2xl mb-4 block">😁</span>
                                <h3 className="text-lg font-semibold text-white mb-2">How To Build A Life, de The Atlantic</h3>
                                <p className="text-xs text-slate-400">46 sources</p>
                            </a>
                            <a href="page_principale.html" className="bg-slate-900 border border-slate-800 p-6 rounded-2xl hover:border-blue-500 hover:shadow-lg hover:shadow-blue-500/10 hover:-translate-y-1 transition-all duration-200 cursor-pointer block">
                                <span className="text-2xl mb-4 block">📜</span>
                                <h3 className="text-lg font-semibold text-white mb-2">William Shakespeare : Œuvres complètes</h3>
                                <p className="text-xs text-slate-400">Bibliothèque littéraire</p>
                            </a>
                        </div>
                    </div>
                </section>
            );
        }

        // Section Vidéo & Animation Interactive Améliorée
        function AnimationShowcase() {
            return (
                <section id="demo-video" className="py-20 bg-slate-950 border-t border-slate-900">
                    <div className="max-w-5xl mx-auto px-6">
                        <div className="text-center max-w-2xl mx-auto mb-12">
                            <span className="px-3 py-1 rounded-full bg-teal-500/10 border border-teal-500/20 text-xs text-teal-400 mb-4 inline-block">Immersion Visuelle</span>
                            <h2 className="text-3xl font-bold tracking-tight text-white mb-4">🎬 Démonstration & Animation en Direct</h2>
                            <p className="text-slate-400">Découvrez comment EverNote synchronise vos fichiers et génère des synthèses en quelques secondes grâce aux animations fluides de l'interface.</p>
                        </div>
                        
                        <div className="relative rounded-3xl overflow-hidden shadow-2xl border border-slate-800 bg-slate-900 p-3 group">
                            <div className="absolute inset-0 bg-gradient-to-tr from-blue-600/10 via-transparent to-teal-500/10 pointer-events-none"></div>
                            
                            {/* Lecteur Vidéo Intégré */}
                            <div className="relative rounded-2xl overflow-hidden aspect-video bg-slate-950 border border-slate-800 flex items-center justify-center">
                                <iframe 
                                    className="w-full h-full object-cover"
                                    src="https://www.youtube.com/embed/ScMzIvxBSi4" 
                                    title="Animation et Présentation EverNote"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen>
                                </iframe>
                            </div>

                            <div className="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 px-2">
                                <div className="flex items-center space-x-3">
                                    <div className="w-3 h-3 rounded-full bg-green-500 animate-ping"></div>
                                    <span className="text-sm text-slate-300 font-medium">Animation UI fluide à 60 FPS propulsée par Tailwind CSS</span>
                                </div>
                                <a href="signup.html" className="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold shadow-lg shadow-blue-600/20 transition-all">
                                    Créer un compte gratuit
                                </a>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function HackathonIdeas() {
            return (
                <section id="hackathon-ideas" className="py-20 border-t border-slate-900 bg-gradient-to-b from-slate-950 to-blue-950/20">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="text-center max-w-2xl mx-auto mb-16">
                            <span className="px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-xs text-blue-400 mb-4 inline-block">Bonus Hackathon</span>
                            <h2 className="text-3xl font-bold tracking-tight text-white mb-4">🚀 Idées de Fonctionnalités à Pitcher</h2>
                            <p className="text-slate-400">Implémentez ces modules pour impressionner le jury par votre créativité technique.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl">
                                <div className="text-blue-400 font-bold text-lg mb-2">🧠 Mind-Map Automatique</div>
                                <p className="text-slate-400 text-sm">Génération instantanée d'une carte mentale interactive basée sur les connexions sémantiques de vos documents importés.</p>
                            </div>
                            <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl">
                                <div className="text-indigo-400 font-bold text-lg mb-2">👥 Espace Collaboratif Live</div>
                                <p className="text-slate-400 text-sm">Permettre à plusieurs utilisateurs d'annoter et interroger un même carnet de notes simultanément en temps réel.</p>
                            </div>
                            <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl">
                                <div className="text-teal-400 font-bold text-lg mb-2">🎙️ Assistant Vocal Intuitif</div>
                                <p className="text-slate-400 text-sm">Mode discussion vocale en direct pour dialoguer directement avec ses fichiers audio et ses résumés sans les mains.</p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function Footer() {
            const [email, setEmail] = React.useState('');
            const [subscribed, setSubscribed] = React.useState(false);

            const handleSubscribe = (e) => {
                e.preventDefault();
                if (!email.trim()) return;
                setSubscribed(true);
                setEmail('');
                setTimeout(() => setSubscribed(false), 4000);
            };

            return (
                <footer className="border-t border-slate-900 bg-slate-950">
                    <div className="max-w-7xl mx-auto px-6 py-16">
                        <div className="relative bg-gradient-to-br from-blue-600/20 via-indigo-500/10 to-teal-400/10 border border-slate-800 rounded-3xl p-10 md:p-14 overflow-hidden flex flex-col md:flex-row items-center justify-between gap-8">
                            <div className="absolute -top-20 -left-20 w-64 h-64 bg-blue-600/20 blur-[100px] rounded-full pointer-events-none"></div>
                            <div className="absolute -bottom-20 -right-20 w-64 h-64 bg-teal-500/15 blur-[100px] rounded-full pointer-events-none"></div>

                            <div className="relative z-10 text-center md:text-left max-w-md">
                                <span className="inline-block px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-xs text-blue-400 mb-4">📬 Newsletter</span>
                                <h3 className="text-2xl md:text-3xl font-bold text-white mb-3 leading-tight">
                                    Restez informé des nouveautés
                                </h3>
                                <p className="text-slate-400 text-sm leading-relaxed">
                                    Recevez les dernières mises à jour d'EverNote, nos conseils IA et les nouvelles fonctionnalités directement dans votre boîte mail.
                                </p>
                            </div>

                            <div className="relative z-10 w-full md:w-auto md:min-w-[360px]">
                                {subscribed ? (
                                    <div className="flex flex-col items-center justify-center py-6 text-center">
                                        <div className="w-14 h-14 rounded-full bg-green-500/20 border border-green-500/30 flex items-center justify-center text-2xl mb-3">✅</div>
                                        <p className="text-green-400 font-semibold text-sm">Merci ! Vous êtes bien inscrit(e).</p>
                                        <p className="text-slate-500 text-xs mt-1">Vérifiez votre boîte mail.</p>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSubscribe} className="flex flex-col sm:flex-row gap-3">
                                        <input
                                            type="email"
                                            required
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            placeholder="votre@email.com"
                                            className="flex-1 bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm transition-all"
                                        />
                                        <button
                                            type="submit"
                                            className="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all duration-200 hover:-translate-y-0.5 text-sm whitespace-nowrap cursor-pointer"
                                        >
                                            S'abonner →
                                        </button>
                                    </form>
                                )}
                                <p className="text-xs text-slate-600 mt-3 text-center">Pas de spam. Désabonnement en un clic.</p>
                            </div>
                        </div>
                    </div>

                    <div className="border-t border-slate-900">
                        <div className="max-w-7xl mx-auto px-6 py-10 flex flex-col md:flex-row items-center justify-between gap-8">
                            <div className="flex flex-col items-center md:items-start gap-2">
                                <div className="flex items-center space-x-2">
                                    <img src="assets/app_logo.png" alt="EverNote Logo" className="w-7 h-7 object-contain" />
                                    <span className="text-base font-bold text-white">EverNote</span>
                                </div>
                                <p className="text-xs text-slate-500 max-w-xs text-center md:text-left">
                                    Votre partenaire de recherche optimisé par l'IA. Propulsé par Gemini.
                                </p>
                            </div>

                            <div className="flex flex-wrap justify-center gap-6 text-sm text-slate-400">
                                <a href="#fonctionnement" className="hover:text-white transition-colors">Fonctionnement</a>
                                <a href="#audio" className="hover:text-white transition-colors">Résumés Audio</a>
                                <a href="#explore" className="hover:text-white transition-colors">Explorer</a>
                                <a href="#demo-video" className="hover:text-white transition-colors">Vidéo & Animation</a>
                                <a href="#hackathon-ideas" className="hover:text-white transition-colors">Hackathon</a>
                                <a href="login.html" className="hover:text-white transition-colors">Connexion</a>
                                <a href="signup.html" className="hover:text-white transition-colors">Inscription</a>
                            </div>

                            <div className="flex items-center space-x-3">
                                <a href="https://github.com" target="_blank" rel="noopener noreferrer" className="w-9 h-9 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition-all" title="GitHub">
                                    <svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                                    </svg>
                                </a>
                                <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" className="w-9 h-9 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition-all" title="Twitter / X">
                                    <svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                                    </svg>
