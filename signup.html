<!DOCTYPE html>
<html lang="fr" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EverNote</title>
    <link rel="icon" type="image/x-icon" href="assets/app_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .input-field { transition: all 0.2s ease; }
        .input-field:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
        }
        .social-btn { transition: all 0.2s ease; }
        .social-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .strength-bar { transition: width 0.3s ease, background-color 0.3s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .step-item { animation: fadeInUp 0.5s ease forwards; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function Signup() {
            const [username, setUsername] = React.useState('');
            const [email, setEmail]       = React.useState('');
            const [password, setPassword] = React.useState('');
            const [confirm, setConfirm]   = React.useState('');
            const [showPass, setShowPass] = React.useState(false);
            const [showConfirm, setShowConfirm] = React.useState(false);
            const [error, setError]       = React.useState('');
            const [loading, setLoading]   = React.useState(false);
            const [agree, setAgree]       = React.useState(false);

            // Password strength
            const getStrength = (p) => {
                let score = 0;
                if (p.length >= 8) score++;
                if (/[A-Z]/.test(p)) score++;
                if (/[0-9]/.test(p)) score++;
                if (/[^A-Za-z0-9]/.test(p)) score++;
                return score;
            };
            const strength = getStrength(password);
            const strengthLabel = ['', 'Faible', 'Moyen', 'Bien', 'Fort'][strength];
            const strengthColor = ['', 'bg-red-500', 'bg-orange-400', 'bg-yellow-400', 'bg-green-500'][strength];

            const handleSignup = (e) => {
                e.preventDefault();
                setError('');
                if (password !== confirm) { setError('Les mots de passe ne correspondent pas.'); return; }
                if (strength < 2) { setError('Veuillez choisir un mot de passe plus solide.'); return; }
                if (!agree) { setError('Veuillez accepter les conditions d\'utilisation.'); return; }
                setLoading(true);
                setTimeout(() => {
                    try { localStorage.setItem('nb_username', username.trim()); } catch (err) {}
                    window.location.href = 'Dashboard.html';
                }, 900);
            };

            const steps = [
                { icon: '✍️', label: 'Créez votre compte' },
                { icon: '📂', label: 'Importez vos sources' },
                { icon: '🤖', label: 'Interrogez l\'IA' },
            ];

            return (
                <div className="min-h-screen flex">

                    {/* ── Left Panel ── */}
                    <div className="hidden lg:flex lg:w-[45%] flex-col justify-between p-12 relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 border-r border-slate-800">
                        <div className="absolute top-[-80px] left-[-80px] w-[400px] h-[400px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>
                        <div className="absolute bottom-[-60px] right-[-60px] w-[300px] h-[300px] bg-teal-600/10 rounded-full blur-[100px] pointer-events-none"></div>

                        {/* Logo */}
                        <a href="app .html" className="flex items-center space-x-3 w-fit group">
                            <img src="assets/app_logo.png" alt="EverNote" className="w-10 h-10 object-contain drop-shadow-lg group-hover:scale-105 transition-transform" />
                            <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">EverNote</span>
                        </a>

                        {/* Center */}
                        <div className="relative z-10">
                            <h1 className="text-4xl font-extrabold text-white leading-tight mb-4">
                                Commencez<br/>
                                <span className="bg-gradient-to-r from-indigo-400 via-blue-300 to-teal-300 bg-clip-text text-transparent">gratuitement</span>
                            </h1>
                            <p className="text-slate-400 text-sm leading-relaxed mb-10 max-w-sm">
                                Rejoignez des milliers d'étudiants et professionnels qui utilisent EverNote pour centraliser et exploiter leurs connaissances.
                            </p>

                            {/* Steps */}
                            <div className="relative">
                                <div className="absolute left-5 top-5 bottom-5 w-px bg-gradient-to-b from-blue-500/40 via-indigo-500/40 to-teal-500/40"></div>
                                <div className="space-y-6">
                                    {steps.map((s, i) => (
                                        <div key={i} className="step-item flex items-center space-x-4" style={{ animationDelay: `${i * 0.15}s` }}>
                                            <div className="w-10 h-10 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-base z-10 flex-shrink-0">
                                                {s.icon}
                                            </div>
                                            <div>
                                                <p className="text-sm font-medium text-slate-200">{s.label}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Stats */}
                            <div className="mt-12 grid grid-cols-3 gap-4">
                                {[
                                    { value: '10K+', label: 'Utilisateurs' },
                                    { value: '50K+', label: 'Notebooks' },
                                    { value: '4.9★', label: 'Note moyenne' },
                                ].map((s, i) => (
                                    <div key={i} className="text-center bg-slate-900/60 border border-slate-800 rounded-2xl py-4 px-2">
                                        <p className="text-lg font-bold text-white">{s.value}</p>
                                        <p className="text-xs text-slate-500 mt-0.5">{s.label}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <p className="text-xs text-slate-700 relative z-10">© 2026 ChangeMakers. Tous droits réservés.</p>
                    </div>

                    {/* ── Right Panel – Form ── */}
                    <div className="w-full lg:w-[55%] flex flex-col justify-center items-center px-6 py-10 overflow-y-auto relative">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/5 rounded-full blur-[100px] pointer-events-none"></div>

                        <div className="w-full max-w-sm relative z-10">

                            {/* Mobile logo */}
                            <a href="app .html" className="lg:hidden flex items-center justify-center space-x-2 mb-8">
                                <img src="assets/app_logo.png" alt="EverNote" className="w-9 h-9 object-contain" />
                                <span className="text-lg font-bold text-white">EverNote</span>
                            </a>

                            {/* Heading */}
                            <div className="mb-7">
                                <h2 className="text-2xl font-bold text-white mb-1">Créer un compte 🚀</h2>
                                <p className="text-sm text-slate-400">C'est gratuit. Aucune carte bancaire requise.</p>
                            </div>

                            {/* Social */}
                            <div className="grid grid-cols-4 gap-3 mb-6">
                                {[
                                    { href: 'https://accounts.google.com/signup', title: 'Google', svg: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56,12.251c0-0.779-0.07-1.53-0.2-2.25H12v4.257h5.92c-0.255,1.376-1.037,2.541-2.208,3.324v2.756h3.573C21.375,18.411,22.56,15.589,22.56,12.251z" fill="#4285F4"/><path d="M12,23c2.97,0,5.46-0.984,7.28-2.661l-3.573-2.756c-0.984,0.659-2.245,1.049-3.707,1.049c-2.855,0-5.27-1.928-6.133-4.522H2.17v2.846C4.01,20.613,7.7,23,12,23z" fill="#34A853"/><path d="M5.867,14.11C5.646,13.451,5.52,12.74,5.52,12c0-0.74,0.126-1.451,0.347-2.11V7.044H2.17C1.408,8.56,1,10.23,1,12c0,1.77,0.408,3.44,1.17,4.956L5.867,14.11z" fill="#FBBC05"/><path d="M12,5.367c1.616,0,3.068,0.556,4.21,1.645l3.155-3.155C17.45,2.022,14.96,1,12,1C7.7,1,4.01,3.387,2.17,7.044l3.697,2.846C6.73,7.295,9.145,5.367,12,5.367z" fill="#EA4335"/></svg> },
                                    { href: 'https://accounts.google.com/signup', title: 'Gmail', svg: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none"><path d="M22 6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6ZM20 6L12 11L4 6H20ZM20 18H4V8L12 13L20 8V18Z" fill="#EA4335"/></svg> },
                                    { href: 'https://login.yahoo.com/account/create', title: 'Yahoo', svg: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="#6001D2"><path d="M22.775 3.167L15.352 13.9v6.933h-3.834V13.9L4.095 3.167h4.375l4.966 7.643 4.965-7.643h4.374z"/></svg> },
                                    { href: 'https://signup.live.com/', title: 'Microsoft', svg: <svg className="w-5 h-5" viewBox="0 0 24 24"><path d="M0 0h11.4v11.4H0z" fill="#f35325"/><path d="M12.6 0H24v11.4H12.6z" fill="#81bc06"/><path d="M0 12.6h11.4V24H0z" fill="#05a6f0"/><path d="M12.6 12.6H24V24H12.6z" fill="#ffba08"/></svg> },
                                ].map((s, i) => (
                                    <a key={i} href={s.href} target="_blank" rel="noopener noreferrer"
                                        className="social-btn flex items-center justify-center py-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-600"
                                        title={`S'inscrire avec ${s.title}`}>
                                        {s.svg}
                                    </a>
                                ))}
                            </div>

                            {/* Divider */}
                            <div className="relative flex items-center mb-6">
                                <div className="flex-1 border-t border-slate-800"></div>
                                <span className="px-4 text-xs text-slate-500">ou avec votre email</span>
                                <div className="flex-1 border-t border-slate-800"></div>
                            </div>

                            {/* Form */}
                            <form onSubmit={handleSignup} className="space-y-4">

                                {/* Username */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nom d'utilisateur</label>
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                        </span>
                                        <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)}
                                            className="input-field w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none"
                                            placeholder="johndoe" />
                                    </div>
                                </div>

                                {/* Email */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Adresse email</label>
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                                        </span>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
                                            className="input-field w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none"
                                            placeholder="john@example.com" />
                                    </div>
                                </div>

                                {/* Password */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Mot de passe</label>
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                        </span>
                                        <input type={showPass ? 'text' : 'password'} required value={password} onChange={(e) => setPassword(e.target.value)}
                                            className="input-field w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-10 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none"
                                            placeholder="••••••••" />
                                        <button type="button" onClick={() => setShowPass(!showPass)}
                                            className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors">
                                            {showPass
                                                ? <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                                                : <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                            }
                                        </button>
                                    </div>
                                    {/* Strength bar */}
                                    {password && (
                                        <div className="mt-2">
                                            <div className="flex space-x-1 mb-1">
                                                {[1,2,3,4].map(i => (
                                                    <div key={i} className={`h-1 flex-1 rounded-full transition-all duration-300 ${i <= strength ? strengthColor : 'bg-slate-800'}`}></div>
                                                ))}
                                            </div>
                                            <p className="text-xs text-slate-500">Force : <span className={`font-medium ${strength >= 3 ? 'text-green-400' : strength === 2 ? 'text-yellow-400' : 'text-red-400'}`}>{strengthLabel}</span></p>
                                        </div>
                                    )}
                                </div>

                                {/* Confirm */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Confirmer le mot de passe</label>
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                                        </span>
                                        <input type={showConfirm ? 'text' : 'password'} required value={confirm} onChange={(e) => setConfirm(e.target.value)}
                                            className={`input-field w-full bg-slate-900 border rounded-xl pl-10 pr-10 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none transition-all ${confirm && confirm !== password ? 'border-red-500/60 focus:border-red-500' : 'border-slate-800 focus:border-blue-500'}`}
                                            placeholder="••••••••" />
                                        <button type="button" onClick={() => setShowConfirm(!showConfirm)}
                                            className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors">
                                            {showConfirm
                                                ? <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                                                : <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                            }
                                        </button>
                                    </div>
                                    {confirm && confirm !== password && (
                                        <p className="text-xs text-red-400 mt-1">Les mots de passe ne correspondent pas.</p>
                                    )}
                                </div>

                                {/* Agree */}
                                <label className="flex items-start space-x-3 cursor-pointer">
                                    <input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)}
                                        className="mt-0.5 accent-blue-500 w-4 h-4 flex-shrink-0" />
                                    <span className="text-xs text-slate-400 leading-relaxed">
                                        J'accepte les <span className="text-blue-400 hover:text-blue-300 cursor-pointer">Conditions d'utilisation</span> et la <span className="text-blue-400 hover:text-blue-300 cursor-pointer">Politique de confidentialité</span>
                                    </span>
                                </label>

                                {/* Error */}
                                {error && (
                                    <div className="flex items-center space-x-2 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3">
                                        <span className="text-red-400 text-lg">⚠️</span>
                                        <p className="text-xs text-red-400">{error}</p>
                                    </div>
                                )}

                                <button type="submit" disabled={loading}
                                    className="btn-primary w-full py-3.5 rounded-xl text-white font-semibold text-sm cursor-pointer disabled:opacity-70 flex items-center justify-center gap-2">
                                    {loading ? (
                                        <>
                                            <svg className="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/></svg>
                                            Création du compte...
                                        </>
                                    ) : 'Créer mon compte →'}
                                </button>
                            </form>

                            <p className="mt-6 text-center text-sm text-slate-500">
                                Déjà un compte ?{' '}
                                <a href="login.html" className="text-blue-400 hover:text-blue-300 font-semibold transition-colors">Se connecter</a>
                            </p>

                            <p className="mt-4 text-center text-xs text-slate-700">
                                © 2026 <span className="text-slate-600">ChangeMakers</span>. Tous droits réservés.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Signup />, document.getElementById('root'));
    </script>
</body>
</html>
