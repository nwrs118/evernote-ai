<!DOCTYPE html>
<html lang="fr" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - EverNote</title>
    <link rel="icon" type="image/x-icon" href="assets/app_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .input-field {
            transition: all 0.2s ease;
        }
        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
        }
        .social-btn {
            transition: all 0.2s ease;
        }
        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .feature-item {
            animation: fadeInUp 0.6s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glow-blue { box-shadow: 0 0 80px rgba(59, 130, 246, 0.15); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function Login() {
            const [username, setUsername] = React.useState('');
            const [password, setPassword]   = React.useState('');
            const [showPass, setShowPass]   = React.useState(false);
            const [loading, setLoading]     = React.useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                const trimmed = username.trim();
                if (!trimmed) return;
                setLoading(true);
                setTimeout(() => {
                    try { localStorage.setItem('nb_username', trimmed); } catch (err) {}
                    window.location.href = 'Dashboard.html';
                }, 800);
            };

            const features = [
                { icon: '🧠', title: 'IA Gemini intégrée', desc: 'Posez des questions sur vos notes en langage naturel.' },
                { icon: '📁', title: 'Centralisation des sources', desc: 'PDF, vidéos YouTube, sites web — tout en un.' },
                { icon: '🔒', title: 'Données sécurisées', desc: 'Vos informations restent privées et protégées.' },
            ];

            return (
                <div className="min-h-screen flex">

                    {/* ── Left Panel – Branding ── */}
                    <div className="hidden lg:flex lg:w-1/2 flex-col justify-between p-12 relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 border-r border-slate-800">

                        {/* Glows */}
                        <div className="absolute top-[-80px] left-[-80px] w-[400px] h-[400px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
                        <div className="absolute bottom-[-60px] right-[-60px] w-[300px] h-[300px] bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>

                        {/* Logo */}
                        <a href="app .html" className="flex items-center space-x-3 w-fit group">
                            <img src="assets/app_logo.png" alt="EverNote" className="w-10 h-10 object-contain drop-shadow-lg group-hover:scale-105 transition-transform" />
                            <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">EverNote</span>
                        </a>

                        {/* Center content */}
                        <div className="relative z-10">
                            <div className="inline-flex items-center space-x-2 bg-blue-500/10 border border-blue-500/20 rounded-full px-4 py-1.5 mb-6">
                                <span className="w-2 h-2 bg-blue-400 rounded-full animate-pulse"></span>
                                <span className="text-xs text-blue-300 font-medium">Propulsé par Gemini AI</span>
                            </div>
                            <h1 className="text-4xl font-extrabold text-white leading-tight mb-4">
                                Votre assistant<br/>
                                <span className="bg-gradient-to-r from-blue-400 via-indigo-300 to-teal-300 bg-clip-text text-transparent">de recherche IA</span>
                            </h1>
                            <p className="text-slate-400 text-sm leading-relaxed mb-10 max-w-sm">
                                Centralisez vos connaissances, interrogez vos documents et obtenez des réponses précises grâce à l'intelligence artificielle.
                            </p>

                            <div className="space-y-4">
                                {features.map((f, i) => (
                                    <div key={i} className="feature-item flex items-start space-x-4 bg-slate-900/60 border border-slate-800 rounded-2xl p-4" style={{ animationDelay: `${i * 0.15}s` }}>
                                        <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600/20 to-indigo-600/20 border border-slate-700 flex items-center justify-center text-lg flex-shrink-0">
                                            {f.icon}
                                        </div>
                                        <div>
                                            <p className="text-sm font-semibold text-white">{f.title}</p>
                                            <p className="text-xs text-slate-500 mt-0.5">{f.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Testimonial */}
                        <div className="relative z-10 border-t border-slate-800 pt-8">
                            <blockquote className="text-sm text-slate-400 italic mb-3">
                                "Une belle façon de parcourir l'espace d'information."
                            </blockquote>
                            <div className="flex items-center space-x-2">
                                <div className="w-7 h-7 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-xs font-bold text-white">V</div>
                                <span className="text-xs text-slate-500">The Verge</span>
                            </div>
                        </div>
                    </div>

                    {/* ── Right Panel – Form ── */}
                    <div className="w-full lg:w-1/2 flex flex-col justify-center items-center px-6 py-12 relative">

                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/5 rounded-full blur-[100px] pointer-events-none"></div>

                        <div className="w-full max-w-sm relative z-10">

                            {/* Mobile logo */}
                            <a href="app .html" className="lg:hidden flex items-center justify-center space-x-2 mb-10">
                                <img src="assets/app_logo.png" alt="EverNote" className="w-9 h-9 object-contain" />
                                <span className="text-lg font-bold text-white">EverNote</span>
                            </a>

                            {/* Heading */}
                            <div className="mb-8">
                                <h2 className="text-2xl font-bold text-white mb-1">Bon retour 👋</h2>
                                <p className="text-sm text-slate-400">Connectez-vous à votre compte EverNote</p>
                            </div>

                            {/* Social buttons */}
                            <div className="grid grid-cols-4 gap-3 mb-6">
                                {[
                                    { href: 'https://accounts.google.com/signin', title: 'Google', svg: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56,12.251c0-0.779-0.07-1.53-0.2-2.25H12v4.257h5.92c-0.255,1.376-1.037,2.541-2.208,3.324v2.756h3.573C21.375,18.411,22.56,15.589,22.56,12.251z" fill="#4285F4"/><path d="M12,23c2.97,0,5.46-0.984,7.28-2.661l-3.573-2.756c-0.984,0.659-2.245,1.049-3.707,1.049c-2.855,0-5.27-1.928-6.133-4.522H2.17v2.846C4.01,20.613,7.7,23,12,23z" fill="#34A853"/><path d="M5.867,14.11C5.646,13.451,5.52,12.74,5.52,12c0-0.74,0.126-1.451,0.347-2.11V7.044H2.17C1.408,8.56,1,10.23,1,12c0,1.77,0.408,3.44,1.17,4.956L5.867,14.11z" fill="#FBBC05"/><path d="M12,5.367c1.616,0,3.068,0.556,4.21,1.645l3.155-3.155C17.45,2.022,14.96,1,12,1C7.7,1,4.01,3.387,2.17,7.044l3.697,2.846C6.73,7.295,9.145,5.367,12,5.367z" fill="#EA4335"/></svg> },
                                    { href: 'https://accounts.google.com/signin', title: 'Gmail', svg: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none"><path d="M22 6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6ZM20 6L12 11L4 6H20ZM20 18H4V8L12 13L20 8V18Z" fill="#EA4335"/></svg> },
                                    { href: 'https://login.yahoo.com/', title: 'Yahoo', svg: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="#6001D2"><path d="M22.775 3.167L15.352 13.9v6.933h-3.834V13.9L4.095 3.167h4.375l4.966 7.643 4.965-7.643h4.374z"/></svg> },
                                    { href: 'https://login.live.com/', title: 'Microsoft', svg: <svg className="w-5 h-5" viewBox="0 0 24 24"><path d="M0 0h11.4v11.4H0z" fill="#f35325"/><path d="M12.6 0H24v11.4H12.6z" fill="#81bc06"/><path d="M0 12.6h11.4V24H0z" fill="#05a6f0"/><path d="M12.6 12.6H24V24H12.6z" fill="#ffba08"/></svg> },
                                ].map((s, i) => (
                                    <a key={i} href={s.href} target="_blank" rel="noopener noreferrer"
                                        className="social-btn flex items-center justify-center py-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-600"
                                        title={`Se connecter avec ${s.title}`}>
                                        {s.svg}
                                    </a>
                                ))}
                            </div>

                            {/* Divider */}
                            <div className="relative flex items-center mb-6">
                                <div className="flex-1 border-t border-slate-800"></div>
                                <span className="px-4 text-xs text-slate-500">ou avec votre compte</span>
                                <div className="flex-1 border-t border-slate-800"></div>
                            </div>

                            {/* Form */}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nom d'utilisateur</label>
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                        </span>
                                        <input
                                            type="text"
                                            required
                                            value={username}
                                            onChange={(e) => setUsername(e.target.value)}
                                            className="input-field w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none"
                                            placeholder="johndoe"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <div className="flex items-center justify-between mb-2">
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Mot de passe</label>
                                        <a href="forgot.html" className="text-xs text-blue-400 hover:text-blue-300 transition-colors">Mot de passe oublié ?</a>
                                    </div>
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                        </span>
                                        <input
                                            type={showPass ? 'text' : 'password'}
                                            required
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            className="input-field w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-10 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none"
                                            placeholder="••••••••"
                                        />
                                        <button type="button" onClick={() => setShowPass(!showPass)}
                                            className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors">
                                            {showPass
                                                ? <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                                                : <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                            }
                                        </button>
                                    </div>
                                </div>

                                <button type="submit" disabled={loading}
                                    className="btn-primary w-full py-3.5 rounded-xl text-white font-semibold text-sm mt-2 cursor-pointer disabled:opacity-70 flex items-center justify-center gap-2">
                                    {loading ? (
                                        <>
                                            <svg className="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/></svg>
                                            Connexion en cours...
                                        </>
                                    ) : 'Se connecter →'}
                                </button>
                            </form>

                            {/* Footer link */}
                            <p className="mt-8 text-center text-sm text-slate-500">
                                Pas encore de compte ?{' '}
                                <a href="signup.html" className="text-blue-400 hover:text-blue-300 font-semibold transition-colors">Créer un compte</a>
                            </p>

                            <p className="mt-6 text-center text-xs text-slate-700">
                                © 2026 <span className="text-slate-600">ChangeMakers</span>. Tous droits réservés.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Login />, document.getElementById('root'));
    </script>
</body>
</html>
