<!DOCTYPE html>
<html lang="fr" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverNote - Dashboard</title>
     <link rel="icon" type="image/x-icon" href="assets/app_logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const INITIAL_NOTEBOOKS = [
            // ── Programmation ──
            { id: 1,  title: "Mastering the Foundations",          date: "13 sept. 2026", sources: "3 sources",  icon: "☕", pinned: true,  collection: "Programmation" },
            { id: 2,  title: "Foundations of Java Programming",    date: "11 sept. 2026", sources: "1 source",   icon: "☕", pinned: false, collection: "Programmation" },
            { id: 3,  title: "React.js Essentials: Concepts",      date: "29 août 2026",  sources: "4 sources",  icon: "⚛️", pinned: true,  collection: "Programmation" },
            { id: 10, title: "JavaScript DOM: Access, Events",     date: "6 mars 2025",   sources: "1 source",   icon: "💻", pinned: false, collection: "Programmation" },
            { id: 11, title: "Python pour la Data Science",        date: "2 juin 2026",   sources: "5 sources",  icon: "🐍", pinned: false, collection: "Programmation" },
            { id: 12, title: "Algorithmes & Structures de données",date: "18 mai 2026",   sources: "6 sources",  icon: "🧮", pinned: false, collection: "Programmation" },

            // ── IA & Neuro ──
            { id: 4,  title: "Rewiring the Entrepreneur",                  date: "12 août 2026",  sources: "1 source",   icon: "🧠", pinned: false, collection: "IA & Neuro" },
            { id: 13, title: "Un ordinateur peut-il simuler un cerveau ?", date: "28 juil. 2026", sources: "17 sources", icon: "🤖", pinned: true,  collection: "IA & Neuro" },
            { id: 14, title: "Les Secrets des Super Agers",                date: "5 mai 2025",    sources: "17 sources", icon: "🧬", pinned: false, collection: "IA & Neuro" },
            { id: 15, title: "Introduction au Deep Learning",              date: "10 avr. 2026",  sources: "8 sources",  icon: "🔬", pinned: false, collection: "IA & Neuro" },

            // ── Réseaux ──
            { id: 5,  title: "Introduction to Computer Networking", date: "22 janv. 2026", sources: "1 source",  icon: "🌐", pinned: false, collection: "Réseaux" },
            { id: 16, title: "Sécurité des Réseaux & Cybersécurité",date: "14 mars 2026", sources: "4 sources",  icon: "🔒", pinned: false, collection: "Réseaux" },
            { id: 17, title: "Protocoles TCP/IP en profondeur",     date: "3 févr. 2026",  sources: "3 sources",  icon: "📡", pinned: false, collection: "Réseaux" },

            // ── Gestion ──
            { id: 6,  title: "The Scrum Framework Essentials",             date: "16 janv. 2026", sources: "15 sources", icon: "🏉", pinned: false, collection: "Gestion" },
            { id: 18, title: "Votre conseiller financier",                  date: "9 mars 2026",   sources: "43 sources", icon: "📈", pinned: false, collection: "Gestion" },
            { id: 19, title: "Comment construire sa vie — The Atlantic",    date: "22 avr. 2025",  sources: "46 sources", icon: "📖", pinned: false, collection: "Gestion" },

            // ── Systèmes ──
            { id: 7,  title: "Généralités et Architecture",          date: "14 nov. 2025", sources: "2 sources",  icon: "💾", pinned: false, collection: "Systèmes" },
            { id: 8,  title: "File Systems, Directories, and I/O",   date: "4 avr. 2025",  sources: "1 source",   icon: "📁", pinned: false, collection: "Systèmes" },
            { id: 9,  title: "File System Management",               date: "9 mars 2025",  sources: "2 sources",  icon: "📂", pinned: false, collection: "Systèmes" },

            // ── Général ──
            { id: 20, title: "Femmes Révolutionnaires : Les Fondatrices", date: "18 févr. 2026", sources: "39 sources", icon: "🌟", pinned: false, collection: "Général" },
            { id: 21, title: "La Science de Benjamin Franklin",            date: "30 sept. 2025", sources: "38 sources", icon: "⚡", pinned: false, collection: "Général" },
        ];

        const FEATURED_NOTEBOOKS = [
            { id: "feat-1", title: "Femmes Révolutionnaires : Les Fondatrices", date: "18 févr. 2026", sources: "39 sources", gradient: "from-purple-900/40 to-slate-900", icon: "🌟" },
            { id: "feat-2", title: "Votre conseiller financier", date: "9 mars 2026", sources: "43 sources", gradient: "from-blue-950 to-slate-900", icon: "📈" },
            { id: "feat-3", title: "Un ordinateur peut-il simuler un cerveau ?", date: "28 juil. 2026", sources: "17 sources", gradient: "from-cyan-950 to-slate-900", icon: "🧠" },
            { id: "feat-4", title: "Comment construire sa vie, par The Atlantic", date: "22 avr. 2025", sources: "46 sources", gradient: "from-red-950 to-slate-900", icon: "📖" },
            { id: "feat-5", title: "Les Secrets des Super Agers", date: "5 mai 2025", sources: "17 sources", gradient: "from-amber-950 to-slate-900", icon: "🧬" },
            { id: "feat-6", title: "La Science de Benjamin Franklin", date: "30 sept. 2025", sources: "38 sources", gradient: "from-stone-900 to-slate-950", icon: "⚡" }
        ];

        const INITIAL_COLLECTIONS = [
            { name: "Programmation", icon: "🗂️" },
            { name: "Systèmes",      icon: "🗂️" },
            { name: "IA & Neuro",    icon: "🗂️" },
            { name: "Réseaux",       icon: "🗂️" },
            { name: "Gestion",       icon: "🗂️" },
            { name: "Général",       icon: "🗂️" },
        ];
        const RANDOM_ICONS = ["📓", "📘", "💡", "🧠", "☕", "🔬", "🚀", "💻", "📚", "⚡", "🎯", "🤖", "📝", "📊"];
        const RANDOM_COLLECTION_ICONS = ["🗂️", "📁", "🧩", "🎨", "🧪", "🏷️", "📦", "🗃️"];

        function App() {
            const [notebooks, setNotebooks] = React.useState(() => {
                const saved = localStorage.getItem('gemini_notebooks');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // If localStorage exists but is empty array (cleared), still show defaults
                    return parsed.length > 0 ? parsed : INITIAL_NOTEBOOKS;
                }
                // First connection — load default notebooks with collections
                return INITIAL_NOTEBOOKS;
            });
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedCollection, setSelectedCollection] = React.useState('Tous');
            const [activeTab, setActiveTab] = React.useState('all');
            const [activeMenuId, setActiveMenuId] = React.useState(null);
            const [toast, setToast] = React.useState(null);
            const [isFilterOpen, setIsFilterOpen] = React.useState(false);
            const [showOnlyPinned, setShowOnlyPinned] = React.useState(false);
            const [openCollection, setOpenCollection] = React.useState(null);
            const [collectionPickerId, setCollectionPickerId] = React.useState(null);
            const [isLogoutModalOpen, setIsLogoutModalOpen] = React.useState(false);

            // Collections dynamiques (initialisées puis persistées)
            const [collections, setCollections] = React.useState(() => {
                const saved = localStorage.getItem('gemini_collections');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return parsed.length > 0 ? parsed : INITIAL_COLLECTIONS;
                }
                return INITIAL_COLLECTIONS;
            });
            const [activeCollectionMenu, setActiveCollectionMenu] = React.useState(null);
            const COLLECTIONS_LIST = ["Tous", ...collections.map(c => c.name)];

            // Nom d'utilisateur récupéré depuis la page de connexion séparée
            // (transmis via l'URL : ?user=Jean, ou stocké par la page de login dans localStorage sous 'nb_username')
            const [currentUsername, setCurrentUsername] = React.useState('Utilisateur');
            React.useEffect(() => {
                // Always read the latest username saved by login.html
                let name = '';
                try { name = localStorage.getItem('nb_username') || ''; } catch (e) {}
                // Also accept ?user= in URL (overrides localStorage)
                try {
                    const params = new URLSearchParams(window.location.search);
                    const fromUrl = params.get('user') || params.get('username') || params.get('name');
                    if (fromUrl) {
                        name = fromUrl;
                        localStorage.setItem('nb_username', fromUrl);
                    }
                } catch (e) {}
                if (name) setCurrentUsername(name);
            }, []);

            // Sauvegarde automatique dans localStorage
            React.useEffect(() => {
                localStorage.setItem('gemini_notebooks', JSON.stringify(notebooks));
            }, [notebooks]);

            React.useEffect(() => {
                localStorage.setItem('gemini_collections', JSON.stringify(collections));
            }, [collections]);

            // Fermer le menu lors d'un clic en dehors
            React.useEffect(() => {
                const handleClickOutside = (e) => {
                    if (!e.target.closest('.menu-container')) {
                        setActiveMenuId(null);
                        setCollectionPickerId(null);
                    }
                    if (!e.target.closest('.collection-menu-container')) {
                        setActiveCollectionMenu(null);
                    }
                    if (!e.target.closest('.filter-container')) {
                        setIsFilterOpen(false);
                    }
                };
                window.addEventListener('click', handleClickOutside);
                return () => window.removeEventListener('click', handleClickOutside);
            }, []);

            const showToast = (message) => {
                setToast({ id: Date.now(), message });
                setTimeout(() => setToast(null), 3000);
            };

            // 1-CLIC : Ajout direct d'un nouveau notebook (sans ouvrir aucune autre page)
            const handleDirectAddNotebook = () => {
                const now = new Date();
                const formattedDate = now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
                const count = notebooks.length + 1;
                const randomIcon = RANDOM_ICONS[Math.floor(Math.random() * RANDOM_ICONS.length)];

                const newNotebook = {
                    id: Date.now(),
                    title: `Nouveau notebook #${count}`,
                    date: formattedDate,
                    sources: "0 source",
                    icon: randomIcon,
                    pinned: false,
                    collection: selectedCollection !== "Tous" ? selectedCollection : "Général"
                };

                setNotebooks([newNotebook, ...notebooks]);
                showToast(`✨ Nouveau notebook #${count} ajouté avec succès !`);
            };

            // Renommer un notebook
            const handleRename = (id, e) => {
                e.stopPropagation();
                const nb = notebooks.find(n => n.id === id);
                const newTitle = prompt("Nouveau titre pour ce notebook :", nb?.title || "");
                if (newTitle && newTitle.trim()) {
                    setNotebooks(notebooks.map(n => n.id === id ? { ...n, title: newTitle.trim() } : n));
                    showToast("Titre mis à jour avec succès !");
                }
                setActiveMenuId(null);
            };

            // Épingler / Désépingler
            const handleTogglePin = (id, e) => {
                e.stopPropagation();
                setNotebooks(notebooks.map(n => {
                    if (n.id === id) {
                        const newPinned = !n.pinned;
                        showToast(newPinned ? "📌 Notebook épinglé en haut !" : "Notebook désépinglé.");
                        return { ...n, pinned: newPinned };
                    }
                    return n;
                }));
                setActiveMenuId(null);
            };

            // Supprimer un notebook
            const handleDelete = (id, e) => {
                e.stopPropagation();
                const nb = notebooks.find(n => n.id === id);
                if (window.confirm(`Voulez-vous vraiment supprimer "${nb?.title}" ?`)) {
                    setNotebooks(notebooks.filter(n => n.id !== id));
                    showToast("Notebook supprimé.");
                }
                setActiveMenuId(null);
            };

            // Ajouter/déplacer un notebook vers une collection (placé en premier, devant les autres cartes)
            const handleAssignCollection = (id, col, e) => {
                e.stopPropagation();
                setNotebooks(prev => {
                    const target = prev.find(n => n.id === id);
                    if (!target) return prev;
                    const rest = prev.filter(n => n.id !== id);
                    return [{ ...target, collection: col }, ...rest];
                });
                showToast(`🗂️ Ajouté à « ${col} » en premier`);
                setActiveMenuId(null);
                setCollectionPickerId(null);
            };

            // Ajouter une nouvelle collection (1 clic + nom)
            const handleAddCollection = () => {
                const name = prompt("Nom de la nouvelle collection :", "");
                if (!name || !name.trim()) return;
                const cleanName = name.trim();
                if (collections.some(c => c.name.toLowerCase() === cleanName.toLowerCase())) {
                    showToast("Cette collection existe déjà.");
                    return;
                }
                const randomIcon = RANDOM_COLLECTION_ICONS[Math.floor(Math.random() * RANDOM_COLLECTION_ICONS.length)];
                setCollections(prev => [...prev, { name: cleanName, icon: randomIcon }]);
                showToast(`🗂️ Collection « ${cleanName} » créée !`);
            };

            // Renommer une collection (et mettre à jour tous les notebooks qui y sont rattachés)
            const handleRenameCollection = (colName, e) => {
                e.stopPropagation();
                const newName = prompt("Nouveau nom pour cette collection :", colName);
                if (newName && newName.trim() && newName.trim() !== colName) {
                    const cleanName = newName.trim();
                    setCollections(prev => prev.map(c => c.name === colName ? { ...c, name: cleanName } : c));
                    setNotebooks(prev => prev.map(n => n.collection === colName ? { ...n, collection: cleanName } : n));
                    if (selectedCollection === colName) setSelectedCollection(cleanName);
                    if (openCollection === colName) setOpenCollection(cleanName);
                    showToast("Collection renommée avec succès !");
                }
                setActiveCollectionMenu(null);
            };

            // Modifier l'icône d'une collection
            const handleChangeCollectionIcon = (colName, e) => {
                e.stopPropagation();
                const newIcon = prompt("Nouvel emoji/icône pour cette collection :", "🗂️");
                if (newIcon && newIcon.trim()) {
                    setCollections(prev => prev.map(c => c.name === colName ? { ...c, icon: newIcon.trim() } : c));
                    showToast("Icône mise à jour !");
                }
                setActiveCollectionMenu(null);
            };

            // Supprimer une collection (les notebooks associés repassent en « Général »)
            const handleDeleteCollection = (colName, e) => {
                e.stopPropagation();
                if (window.confirm(`Supprimer la collection « ${colName} » ? Les notebooks associés repasseront dans « Général ».`)) {
                    setCollections(prev => prev.filter(c => c.name !== colName));
                    setNotebooks(prev => prev.map(n => n.collection === colName ? { ...n, collection: "Général" } : n));
                    if (selectedCollection === colName) setSelectedCollection('Tous');
                    if (openCollection === colName) setOpenCollection(null);
                    showToast("Collection supprimée.");
                }
                setActiveCollectionMenu(null);
            };

            // Filtrage recherche & collections
            let filtered = [...notebooks];
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(n => 
                    n.title.toLowerCase().includes(q) || 
                    (n.collection && n.collection.toLowerCase().includes(q))
                );
            }
            if (selectedCollection !== "Tous") {
                filtered = filtered.filter(n => n.collection === selectedCollection);
            }
            if (showOnlyPinned) {
                filtered = filtered.filter(n => n.pinned);
            }
            filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
            const activeFilterCount = (selectedCollection !== "Tous" ? 1 : 0) + (showOnlyPinned ? 1 : 0);
            const pinnedNotebooks = notebooks.filter(n => n.pinned);

            const renderNotebookCard = (item) => (
                <a
                    key={item.id}
                    href="page_principale.html"
                    className={`h-44 rounded-2xl p-4 flex flex-col justify-between bg-slate-900 border ${item.pinned ? 'border-green-500/40 bg-gradient-to-b from-green-950/20 to-slate-900' : 'border-slate-800/80'} hover:border-slate-700 cursor-pointer transition shadow-md relative group hover:-translate-y-0.5 duration-150`}
                >
                    {item.pinned && (
                        <div className="absolute top-3 left-3 text-[10px] text-green-400 bg-green-500/10 border border-green-500/20 px-1.5 py-0.5 rounded flex items-center space-x-1">
                            <span>📌</span>
                            <span className="font-medium">Épinglé</span>
                        </div>
                    )}

                    {/* Menu Actions (⋮) */}
                    <div className="absolute top-2.5 right-2.5 menu-container z-20">
                        <button
                            onClick={(e) => {
                                e.stopPropagation();
                                e.preventDefault();
                                setCollectionPickerId(null);
                                setActiveMenuId(activeMenuId === item.id ? null : item.id);
                            }}
                            className="w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition opacity-0 group-hover:opacity-100"
                            title="Actions"
                        >
                            ⋮
                        </button>

                        {activeMenuId === item.id && (
                            <div className="absolute right-0 mt-1 w-56 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1 text-xs text-slate-200 z-30 backdrop-blur-xl">
                                {collectionPickerId === item.id ? (
                                    <>
                                        <button onClick={(e) => { e.stopPropagation(); e.preventDefault(); setCollectionPickerId(null); }} className="w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2.5 transition text-slate-400">
                                            <span>←</span><span>Retour</span>
                                        </button>
                                        <div className="border-t border-slate-800 my-1"></div>
                                        {collections.map((col) => (
                                            <button key={col.name} onClick={(e) => { e.preventDefault(); handleAssignCollection(item.id, col.name, e); }} className={`w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2.5 transition ${item.collection === col.name ? 'text-green-400' : ''}`}>
                                                <span>{item.collection === col.name ? '✓' : col.icon}</span><span>{col.name}</span>
                                            </button>
                                        ))}
                                    </>
                                ) : (
                                    <>
                                        <button onClick={(e) => { e.preventDefault(); handleRename(item.id, e); }} className="w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2.5 transition">
                                            <span>✏️</span><span>Modifier le titre</span>
                                        </button>
                                        <button onClick={(e) => { e.stopPropagation(); e.preventDefault(); setCollectionPickerId(item.id); }} className="w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2.5 transition">
                                            <span>🗂️</span><span>Ajouter à une collection</span>
                                        </button>
                                        <button onClick={(e) => { e.preventDefault(); handleTogglePin(item.id, e); }} className="w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2.5 transition">
                                            <span>{item.pinned ? '📍' : '📌'}</span><span>{item.pinned ? 'Désépingler' : 'Épingler en haut'}</span>
                                        </button>
                                        <div className="border-t border-slate-800 my-1"></div>
                                        <button onClick={(e) => { e.preventDefault(); handleDelete(item.id, e); }} className="w-full text-left px-3.5 py-2 hover:bg-red-500/10 text-red-400 flex items-center space-x-2.5 transition">
                                            <span>🗑️</span><span>Supprimer</span>
                                        </button>
                                    </>
                                )}
                            </div>
                        )}
                    </div>

                    <div className={item.pinned ? "mt-4" : ""}>
                        <span className="text-xl mb-2.5 block">{item.icon}</span>
                        <h3 className="text-xs font-medium text-slate-200 line-clamp-2 leading-snug group-hover:text-green-300 transition-colors">
                            {item.title}
                        </h3>
                        {item.collection && (
                            <span className="text-[10px] text-slate-400/80 mt-1 block truncate">{item.collection}</span>
                        )}
                    </div>

                    <div className="text-[11px] text-slate-500 pt-2 border-t border-slate-800/50 flex justify-between items-center">
                        <p className="truncate">{item.date}</p>
                        <p className="text-slate-400 font-medium text-[10px]">{item.sources}</p>
                    </div>
                </a>
            );

            const addNotebookTile = (
                <div
                    key="add-tile"
                    onClick={handleDirectAddNotebook}
                    className="h-44 rounded-2xl border border-dashed border-green-500/40 bg-green-600/5 hover:bg-green-600/10 hover:border-green-400 flex flex-col items-center justify-center cursor-pointer transition text-green-400 group p-4 text-center select-none transform hover:-translate-y-0.5 active:scale-95 duration-150"
                    title="Cliquer pour ajouter directement un nouveau notebook"
                >
                    <div className="w-10 h-10 rounded-full bg-green-600 flex items-center justify-center text-white mb-2 shadow-lg shadow-green-600/30 group-hover:scale-110 transition-transform">
                        <span className="text-xl leading-none font-bold">+</span>
                    </div>
                    <span className="text-xs font-semibold">Nouveau notebook</span>
                    <span className="text-[10px] text-green-400/70 mt-1">Ajouter en 1 clic</span>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col pb-20">
                    {/* Header / Navbar */}
                    <header className="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-900">
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-8">
                                <button onClick={() => window.location.href = 'app .html'} className="flex items-center space-x-3 cursor-pointer group bg-transparent border-none outline-none" title="Aller à la page d'accueil">
                                    <img src="assets/app_logo.png" alt="Logo" className="w-8 h-8 object-contain drop-shadow-md group-hover:scale-105 transition transform" />
                                    <span className="text-lg font-bold tracking-tight text-white group-hover:text-blue-400 transition-colors">EverNote</span>
                                </button>

                                <nav className="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-400">
                                    <button onClick={() => { setActiveTab('all'); setOpenCollection(null); }} className={`pb-1 border-b-2 transition ${activeTab === 'all' ? 'text-white border-green-500 font-semibold' : 'border-transparent hover:text-white'}`}>Tous</button>
                                    <button onClick={() => { setActiveTab('my'); setOpenCollection(null); }} className={`pb-1 border-b-2 transition ${activeTab === 'my' ? 'text-white border-green-500 font-semibold' : 'border-transparent hover:text-white'}`}>Mes notebooks</button>
                                    <button onClick={() => { setActiveTab('collections'); setOpenCollection(null); }} className={`pb-1 border-b-2 transition ${activeTab === 'collections' ? 'text-white border-green-500 font-semibold' : 'border-transparent hover:text-white'}`}>Collections</button>
                                </nav>
                            </div>

                            <div className="flex items-center space-x-4">
                                <div className="relative hidden sm:block">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                    </span>
                                    <input 
                                        type="text" 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Rechercher des notebooks..." 
                                        className="bg-slate-900 border border-slate-800 rounded-full pl-9 pr-8 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 w-64 transition" 
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 text-slate-400 hover:text-white">✕</button>
                                    )}
                                </div>

                                <div className="relative filter-container hidden sm:block">
                                    <button
                                        onClick={() => setIsFilterOpen(prev => !prev)}
                                        className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition ${activeFilterCount > 0 ? 'bg-green-600/20 border-green-500/40 text-green-300' : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'}`}
                                        title="Filtrer les notebooks"
                                    >
                                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4h18M6 8h12M10 12h4"></path></svg>
                                        <span>Filtrer</span>
                                        {activeFilterCount > 0 && <span className="w-4 h-4 rounded-full bg-green-500 text-[10px] flex items-center justify-center text-white">{activeFilterCount}</span>}
                                    </button>

                                    {isFilterOpen && (
                                        <div className="absolute right-0 mt-2 w-64 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-3.5 z-30 backdrop-blur-xl">
                                            <p className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold mb-2 px-0.5">Collection</p>
                                            <div className="flex flex-wrap gap-1.5 mb-3">
                                                {COLLECTIONS_LIST.map((col) => (
                                                    <button
                                                        key={col}
                                                        onClick={() => setSelectedCollection(col)}
                                                        className={`px-2.5 py-1 rounded-full text-[11px] font-medium transition ${selectedCollection === col ? 'bg-green-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}
                                                    >
                                                        {col}
                                                    </button>
                                                ))}
                                            </div>
                                            <label className="flex items-center gap-2 px-0.5 py-1.5 text-xs text-slate-300 cursor-pointer">
                                                <input type="checkbox" checked={showOnlyPinned} onChange={(e) => setShowOnlyPinned(e.target.checked)} className="accent-green-500" />
                                                Épinglés uniquement
                                            </label>
                                            {activeFilterCount > 0 && (
                                                <button
                                                    onClick={() => { setSelectedCollection('Tous'); setShowOnlyPinned(false); }}
                                                    className="mt-2 w-full text-center text-[11px] text-slate-400 hover:text-white py-1.5 rounded-lg hover:bg-slate-800 transition"
                                                >
                                                    Réinitialiser les filtres
                                                </button>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <div className="flex items-center space-x-2">
                                    <span className="hidden md:inline text-sm text-slate-300 font-medium">{currentUsername}</span>
                                    {/* Avatar — click to open logout popup */}
                                    <button
                                        onClick={() => setIsLogoutModalOpen(true)}
                                        title={`Déconnecter ${currentUsername}`}
                                        className="w-9 h-9 rounded-full bg-gradient-to-r from-green-500 to-lime-400 flex items-center justify-center text-xs font-bold text-white shadow ring-2 ring-transparent hover:ring-green-400 transition cursor-pointer"
                                    >
                                        {currentUsername.charAt(0).toUpperCase()}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Épinglés : toujours visible en haut de la page */}
                    {pinnedNotebooks.length > 0 && (
                        <section className="pt-8 pb-2 max-w-7xl mx-auto px-6 w-full">
                            <div className="flex items-center space-x-2 mb-4">
                                <span className="text-lg">📌</span>
                                <h2 className="text-lg font-semibold text-white">Épinglés</h2>
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-4">
                                {pinnedNotebooks.map((item) => renderNotebookCard(item))}
                            </div>
                        </section>
                    )}

                    {/* Sélection de notebooks (Featured) */}
                    {activeTab === 'all' && (
                    <section className="py-8 max-w-7xl mx-auto px-6 w-full">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center space-x-2">
                                <span className="text-lg">✨</span>
                                <h2 className="text-lg font-semibold text-white">Sélection de notebooks</h2>
                            </div>
                            <span className="text-xs text-blue-400 font-medium">Recommandés pour vous</span>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                            {FEATURED_NOTEBOOKS.map((item) => (
                                <a 
                                    key={item.id}
                                    href="page_principale.html"
                                    className={`h-48 rounded-2xl p-4 flex flex-col justify-between border border-slate-800 bg-gradient-to-b ${item.gradient} hover:border-blue-500/50 hover:shadow-blue-500/10 cursor-pointer transition transform hover:-translate-y-1 shadow-lg relative group overflow-hidden`}
                                >
                                    <div>
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs px-2 py-0.5 rounded bg-black/40 text-blue-300 inline-block font-medium">Featured</span>
                                            <span className="text-sm opacity-80">{item.icon}</span>
                                        </div>
                                        <h3 className="text-sm font-medium text-slate-100 line-clamp-2 leading-snug group-hover:text-blue-300 transition-colors">{item.title}</h3>
                                    </div>
                                    <div className="text-[11px] text-slate-400 flex items-center justify-between pt-2 border-t border-white/5">
                                        <span>{item.date}</span>
                                        <span>{item.sources}</span>
                                    </div>
                                </a>
                            ))}
                        </div>
                    </section>
                    )}

                    {/* Section Mes Notebooks / Collections */}
                    <section className="py-6 max-w-7xl mx-auto px-6 w-full flex-1">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-5 gap-3">
                            <div className="flex items-center space-x-3">
                                {activeTab === 'collections' && openCollection ? (
                                    <button onClick={() => setOpenCollection(null)} className="text-sm text-slate-400 hover:text-white flex items-center gap-1.5 mr-1">
                                        <span>←</span><span>Collections</span>
                                    </button>
                                ) : null}
                                <h2 className="text-lg font-semibold text-white">
                                    {activeTab === 'collections' ? (openCollection || 'Collections') : activeTab === 'my' ? 'Mes notebooks' : 'Notebooks récents'}
                                </h2>
                                {(activeTab !== 'collections' || openCollection) && (
                                    <span className="text-xs px-2.5 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-slate-400 font-medium">
                                        {filtered.length} carnet{filtered.length > 1 ? 's' : ''}
                                    </span>
                                )}
                            </div>
                        </div>

                        {activeTab === 'collections' && !openCollection ? (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                {/* Tuile : Ajouter une collection (1 clic) */}
                                <div
                                    onClick={handleAddCollection}
                                    className="h-32 rounded-2xl border border-dashed border-green-500/40 bg-green-600/5 hover:bg-green-600/10 hover:border-green-400 flex flex-col items-center justify-center cursor-pointer transition text-green-400 group p-4 text-center select-none transform hover:-translate-y-0.5 active:scale-95 duration-150"
                                    title="Cliquer pour créer une nouvelle collection"
                                >
                                    <div className="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white mb-1.5 shadow-lg shadow-green-600/30 group-hover:scale-110 transition-transform">
                                        <span className="text-base leading-none font-bold">+</span>
                                    </div>
                                    <span className="text-xs font-semibold">Nouvelle collection</span>
                                </div>

                                {collections.map((col) => {
                                    const count = notebooks.filter(n => n.collection === col.name).length;
                                    return (
                                        <div key={col.name} onClick={() => setOpenCollection(col.name)}
                                            className="h-32 rounded-2xl p-4 flex flex-col justify-between bg-slate-900 border border-slate-800/80 hover:border-green-500/40 cursor-pointer transition shadow-md hover:-translate-y-0.5 duration-150 relative group">

                                            {/* Menu Actions (⋮) sur la collection */}
                                            <div className="absolute top-2.5 right-2.5 collection-menu-container z-20">
                                                <button
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        setActiveCollectionMenu(activeCollectionMenu === col.name ? null : col.name);
                                                    }}
                                                    className="w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition opacity-0 group-hover:opacity-100"
                                                    title="Actions"
                                                >
                                                    ⋮
                                                </button>

                                                {activeCollectionMenu === col.name && (
                                                    <div onClick={(e) => e.stopPropagation()} className="absolute right-0 mt-1 w-52 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1 text-xs text-slate-200 z-30 backdrop-blur-xl">
                                                        <button onClick={(e) => handleRenameCollection(col.name, e)} className="w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2.5 transition">
                                                            <span>✏️</span><span>Renommer</span>
                                                        </button>
                                                        <button onClick={(e) => handleChangeCollectionIcon(col.name, e)} className="w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2.5 transition">
                                                            <span>🎨</span><span>Modifier l'icône</span>
                                                        </button>
                                                        <div className="border-t border-slate-800 my-1"></div>
                                                        <button onClick={(e) => handleDeleteCollection(col.name, e)} className="w-full text-left px-3.5 py-2 hover:bg-red-500/10 text-red-400 flex items-center space-x-2.5 transition">
                                                            <span>🗑️</span><span>Supprimer</span>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>

                                            <span className="text-2xl">{col.icon}</span>
                                            <div>
                                                <h3 className="text-sm font-medium text-slate-200 truncate pr-4">{col.name}</h3>
                                                <p className="text-[11px] text-slate-500 mt-0.5">{count} carnet{count > 1 ? 's' : ''}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-4">
                            {addNotebookTile}
                            {(activeTab === 'collections' ? filtered.filter(n => n.collection === openCollection) : filtered).map((item) => renderNotebookCard(item))}
                        </div>
                        )}

                        {activeTab !== 'collections' && filtered.length === 0 && (
                            <div className="text-center py-16 bg-slate-900/30 rounded-2xl border border-slate-900 mt-4">
                                <span className="text-3xl mb-3 block">🔍</span>
                                <p className="text-sm font-semibold text-slate-300">Aucun notebook ne correspond à votre recherche</p>
                                <button onClick={handleDirectAddNotebook} className="mt-4 px-4 py-2 bg-green-600 hover:bg-green-500 text-xs font-semibold text-white rounded-xl shadow-lg transition">
                                    + Ajouter un notebook
                                </button>
                            </div>
                        )}
                    </section>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 bg-blue-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 text-xs font-semibold border border-blue-400/30 animate-bounce">
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* ===== LOGOUT CONFIRMATION POPUP ===== */}
                    {isLogoutModalOpen && (
                        <div className="fixed inset-0 z-[999] flex items-center justify-center p-4">
                            {/* Backdrop */}
                            <div
                                className="absolute inset-0 bg-black/70 backdrop-blur-sm"
                                onClick={() => setIsLogoutModalOpen(false)}
                            />

                            {/* Modal Card */}
                            <div className="relative bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl w-full max-w-sm p-8 flex flex-col items-center text-center z-10">

                                {/* Close X */}
                                <button
                                    onClick={() => setIsLogoutModalOpen(false)}
                                    className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition text-lg leading-none cursor-pointer"
                                >
                                    ×
                                </button>

                                {/* Avatar */}
                                <div className="w-20 h-20 rounded-full bg-gradient-to-br from-green-500 to-lime-400 flex items-center justify-center text-3xl font-bold text-white shadow-xl shadow-green-500/30 mb-4 ring-4 ring-green-500/20">
                                    {currentUsername.charAt(0).toUpperCase()}
                                </div>

                                {/* Name */}
                                <h3 className="text-xl font-bold text-white mb-1">{currentUsername}</h3>

                                {/* ID badge */}
                                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs text-slate-400 font-mono mb-6">
                                    <span className="w-1.5 h-1.5 rounded-full bg-green-400 inline-block"></span>
                                    ID: {currentUsername.toLowerCase().replace(/\s+/g, '_')}@evernote
                                </span>

                                {/* Message */}
                                <p className="text-slate-400 text-sm mb-8 leading-relaxed">
                                    Êtes-vous sûr(e) de vouloir vous déconnecter de votre compte <span className="text-white font-semibold">{currentUsername}</span> ?
                                </p>

                                {/* Buttons */}
                                <div className="flex flex-col gap-3 w-full">
                                    <button
                                        onClick={() => {
                                            try { localStorage.removeItem('nb_username'); } catch(e) {}
                                            window.location.href = 'login.html';
                                        }}
                                        className="w-full py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-semibold text-sm transition shadow-lg shadow-red-600/20 cursor-pointer flex items-center justify-center gap-2"
                                    >
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/>
                                            <polyline points="15 17 20 12 15 7"/>
                                            <line x1="20" y1="12" x2="9" y2="12"/>
                                        </svg>
                                        Confirmer la déconnexion
                                    </button>
                                    <button
                                        onClick={() => setIsLogoutModalOpen(false)}
                                        className="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium text-sm transition cursor-pointer"
                                    >
                                        Annuler
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
